spring.application.name=demo

# ==========================================================
# Base de datos (PostgreSQL / Supabase)
# Estas variables NO tienen valores por defecto a proposito:
# si faltan, la app falla rapido en vez de usar credenciales
# antiguas o de otra persona. Se configuran como variables de
# entorno en Render (ver render.yaml) y en application-local.properties
# para desarrollo local (ese archivo esta en .gitignore).
# ==========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SQL_INIT_MODE:never}


spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:tu_correo@gmail.com}
spring.mail.password=${MAIL_PASSWORD:abcdefghijklmnop}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# ==========================================================
# Supabase Storage (adjuntos del historial clinico)
# SUPABASE_SERVICE_KEY = "service_role key" (Project Settings > API),
# NUNCA la "anon key". Es secreta: solo vive en el backend / Render.
# Crea antes un bucket PRIVADO llamado igual que supabase.storage.bucket.
# ==========================================================
supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:historial-clinico}

server.port=${PORT:8080}
