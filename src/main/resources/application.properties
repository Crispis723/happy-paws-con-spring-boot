spring.application.name=demo

# ==========================================================
# Base de datos (Supabase PostgreSQL)
# ==========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# NOTA: spring.jpa.open-in-view queda en su valor por defecto (true) a
# propósito. Desactivarlo sería mejor práctica (evita N+1 silenciosos),
# pero requiere primero anotar con @Transactional(readOnly = true) los
# métodos de lectura de CompraService, VentaService, ProveedorService,
# ClienteService, AppointmentService, HistorialMascotaService, PetService,
# UnidadService y AfectacionTipoService, ya que varias vistas Thymeleaf
# (compras, ventas, citas, historial) acceden a relaciones LAZY confiando
# en que OSIV las resuelva durante el render.

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SQL_INIT_MODE:never}


# ==========================================================
#envío de correos 
# ==========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Configuración obligatoria para el puerto 465 (SSL Directo)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# Reducir los timeouts para detectar fallos de inmediato (3 segundos)
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
# ==========================================================
# Supabase Storage (adjuntos del historial clínico)
# ==========================================================

supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:historial-clinico}

# ==========================================================
# Servidor
# ==========================================================

server.port=${PORT:8080}

# ==========================================================
# Subida de archivos (imágenes de productos)
# ==========================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB

# Las imágenes de productos se guardan en Supabase Storage (ver
# ProductoService y SupabaseStorageService), no en disco local: el disco
# de Render en el plan free es efímero y se borra en cada redeploy.
# Usa el mismo bucket que el historial clínico (supabase.storage.bucket,
# más abajo), en la carpeta "productos/" dentro de ese bucket.

# URL publica usada para enlaces de recuperacion de contrasena
app.base-url=${APP_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}

# ==========================================================
# SESIONES HTTP PERSISTENTES (Spring Session + PostgreSQL)
# ==========================================================
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.cleanup-cron=0 * * * * *
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Cookie de sesión: no persistirla como cookie permanente.
server.servlet.session.cookie.max-age=-1
server.servlet.session.tracking-modes=cookie
