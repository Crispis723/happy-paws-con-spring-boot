<div xmlns:th="http://www.thymeleaf.org" th:fragment="actionModal">
    <div class="modal fade" id="modalUpdate" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <form id="formUpdate" method="post">
                    <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">
                    <input type="hidden" id="method_field" name="_method">
                    <div class="modal-header bg-primary text-white">
                        <h4 class="modal-title fs-5" id="modalTitle">Nuevo proveedor</h4>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="documento_tipo_codigo" class="form-label fw-semibold">Documento tipo <span class="text-danger">*</span></label>
                                <input type="text" id="documento_tipo_codigo" name="documento_tipo_codigo" class="form-control" placeholder="01" required>
                            </div>
                            <div class="col-md-6">
                                <label for="numero_documento" class="form-label fw-semibold">Número de documento <span class="text-danger">*</span></label>
                                <input type="text" id="numero_documento" name="numero_documento" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="razon_social" class="form-label fw-semibold">Razón social <span class="text-danger">*</span></label>
                                <input type="text" id="razon_social" name="razon_social" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="direccion" class="form-label fw-semibold">Dirección</label>
                                <input type="text" id="direccion" name="direccion" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label for="telefono" class="form-label fw-semibold">Teléfono</label>
                                <input type="text" id="telefono" name="telefono" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Email</label>
                                <input type="email" id="email" name="email" class="form-control">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="btnSubmit" class="btn btn-primary">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
