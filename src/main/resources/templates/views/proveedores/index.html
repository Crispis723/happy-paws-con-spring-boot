<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">

<div th:replace="~{partials/session-guard :: guard}"></div>

</head>
<body>
    <div th:insert="~{partials/header :: header}"></div>
    <div class="container-fluid p-4">
        <div class="card">
            <div class="card-header d-flex align-items-center">
                <h3 class="card-title flex-grow-1 mb-0">Proveedores</h3>
                <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm me-2"><i class="bi bi-arrow-left me-1"></i> Regresar</a>
                <a th:href="@{/proveedores/nuevo}" class="btn btn-primary btn-sm">Nuevo proveedor</a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Razón social</th>
                                <th>Documento</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(proveedores)}">
                                <td colspan="5" class="text-center text-muted py-4">No hay proveedores registrados.</td>
                            </tr>
                            <tr th:each="proveedor : ${proveedores}">
                                <td th:text="${proveedor.razonSocial}">Proveedor</td>
                                <td th:text="${proveedor.numeroDocumento}">--</td>
                                <td th:text="${proveedor.email}">--</td>
                                <td th:text="${proveedor.telefono}">--</td>
                                <td>
                                    <a th:href="@{/proveedores/edit/{id}(id=${proveedor.id})}" class="btn btn-sm btn-outline-warning">Editar</a>
                                    <a th:href="@{/proveedores/delete/{id}(id=${proveedor.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar este proveedor?')">Eliminar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div th:insert="~{partials/footer :: footer}"></div>
</body>
</html>
