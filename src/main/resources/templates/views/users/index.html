<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="page-shell">
        <div class="hero-panel d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
            <div>
                <span class="hero-kicker mb-2"><i class="bi bi-people"></i> Administración</span>
                <h1 class="display-6 fw-bold mb-2">Usuarios</h1>
                <p class="mb-0 opacity-75">Controla cuentas, estado y roles desde una pantalla coherente con el resto del sistema.</p>
            </div>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-light btn-lg rounded-pill fw-semibold text-info px-4"><i class="bi bi-plus-circle me-1"></i> Nuevo usuario</a>
        </div>

        <div class="surface-card p-4">
            <div class="table-responsive">
                <table class="table app-table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Roles</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(users)}"><td colspan="5" class="text-center text-muted py-4">No hay usuarios registrados.</td></tr>
                        <tr th:each="user : ${users}">
                            <td class="fw-semibold" th:text="${user.name}">--</td>
                            <td th:text="${user.email}">--</td>
                            <td>
                                <span class="role-badge me-1 mb-1" th:each="role : ${user.roles}" th:classappend="${role.name == 'ADMIN' ? 'role-badge--danger' : (role.name == 'VETERINARIO' ? 'role-badge--primary' : (role.name == 'RECEPCIONISTA' ? 'role-badge--success' : 'role-badge--info'))}" th:text="${role.name}">ROL</span>
                            </td>
                            <td>
                                <span class="stat-pill" th:classappend="${user.enabled ? '' : ' opacity-75'}"><i class="bi" th:classappend="${user.enabled ? 'bi-check-circle-fill' : 'bi-dash-circle-fill'}"></i> <span th:text="${user.enabled ? 'Activo' : 'Inactivo'}">Activo</span></span>
                            </td>
                            <td>
                                <a th:href="@{/usuarios/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/usuarios/delete/{id}(id=${user.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar este usuario?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
