<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="container-fluid p-4">
        <div class="card">
            <div class="card-header d-flex align-items-center">
                <h3 class="card-title flex-grow-1 mb-0">Usuarios</h3>
                <a th:href="@{/usuarios/nuevo}" class="btn btn-primary btn-sm">Nuevo usuario</a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Roles</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(users)}"><td colspan="5" class="text-center text-muted py-4">No hay usuarios registrados.</td></tr>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.name}">--</td>
                                <td th:text="${user.email}">--</td>
                                <td>
                                    <span th:each="role, iterStat : ${user.roles}" th:text="${role.name + (iterStat.last ? '' : ', ')}"></span>
                                </td>
                                <td th:text="${user.enabled ? 'Activo' : 'Inactivo'}">--</td>
                                <td>
                                    <a th:href="@{/usuarios/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-warning">Editar</a>
                                    <a th:href="@{/usuarios/delete/{id}(id=${user.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar este usuario?')">Eliminar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
