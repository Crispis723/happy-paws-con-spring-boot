<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="page-shell">
        <div class="hero-panel d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
            <div>
                <span class="hero-kicker mb-2"><i class="bi bi-person-badge"></i> Administración</span>
                <h1 class="display-6 fw-bold mb-2" th:text="${user.id == null ? 'Nuevo usuario' : 'Editar usuario'}">Usuario</h1>
                <p class="mb-0 opacity-75">Solo el administrador puede crear usuarios y asignar roles.</p>
            </div>
            <a th:href="@{/usuarios}" class="btn btn-light btn-lg rounded-pill fw-semibold text-info px-4"><i class="bi bi-arrow-left me-1"></i> Volver</a>
        </div>

        <div class="surface-card p-4 p-md-5">
            <form th:action="@{/usuarios/guardar}" th:object="${user}" method="post" class="row g-4">
                <input type="hidden" th:field="*{id}">
                <div class="col-lg-6">
                    <label class="form-label fw-semibold">Nombre</label>
                    <input class="form-control form-control-lg" th:field="*{name}" placeholder="Nombre completo">
                </div>
                <div class="col-lg-6">
                    <label class="form-label fw-semibold">Email</label>
                    <input class="form-control form-control-lg" th:field="*{email}" placeholder="correo@dominio.com">
                </div>
                <div class="col-lg-6">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control form-control-lg" th:field="*{password}" placeholder="Mínimo 8 caracteres">
                </div>
                <div class="col-lg-6">
                    <label class="form-label fw-semibold">Estado</label>
                    <select class="form-select form-select-lg" th:field="*{enabled}"><option th:value="true">Activo</option><option th:value="false">Inactivo</option></select>
                </div>
                <div class="col-12">
                    <div class="surface-card p-4 theme-outline bg-light">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <div>
                                <h5 class="fw-bold mb-1">Roles del usuario</h5>
                                <p class="text-muted mb-0">Selecciona uno o más perfiles. Este acceso queda restringido a administración.</p>
                            </div>
                            <span class="role-badge role-badge--danger"><i class="bi bi-shield-lock"></i> Solo admin</span>
                        </div>
                        <div id="roles-list">
                            <div class="d-flex flex-wrap">
                                <div class="role-toggle" th:each="role : ${roles}">
                                    <input type="checkbox" th:id="${'role-' + role.id}" name="roleIds" th:value="${role.id}" th:checked="${user != null and user.roleIds != null and user.roleIds.contains(role.id)}" />
                                    <label th:for="${'role-' + role.id}" th:text="${role.name}"></label>
                                </div>
                            </div>
                            <div class="form-text mt-2">Haz clic en las etiquetas para activar/desactivar roles.</div>
                        </div>
                    </div>
                </div>
                <div class="col-12 d-flex justify-content-end gap-2 pt-2">
                    <a th:href="@{/usuarios}" class="btn btn-outline-secondary btn-lg px-4">Cancelar</a>
                    <button type="submit" class="btn btn-primary btn-lg px-4">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
