<div xmlns:th="http://www.thymeleaf.org">
    <div class="modal fade" id="modalUpdate" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="formUpdate" method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf != null ? _csrf.token : ''}">
                    <input type="hidden" id="method_field" name="_method">
                    <div class="modal-header bg-primary text-white">
                        <h4 class="modal-title fs-5" id="modalTitle">Nuevo usuario</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-lg-6">
                                <label for="name" class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                                <input type="text" id="name" name="name" class="form-control" required>
                            </div>
                            <div class="col-lg-6">
                                <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                                <input type="text" id="email" name="email" class="form-control" required>
                            </div>
                            <div class="col-lg-6">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="text" id="password" name="password" class="form-control">
                            </div>
                            <div class="col-lg-6">
                                <label for="activo" class="form-label fw-semibold">Activo <span class="text-danger">*</span></label>
                                <select name="activo" id="activo" class="form-select" required>
                                    <option value="1">Activo</option>
                                    <option value="0">Inactivo</option>
                                </select>
                            </div>
                            <div class="col-lg-12">
                                <label class="form-label fw-semibold">Roles</label>
                                <div id="checkbox-roles" class="row"></div>
                                <div class="invalid-feedback d-block" id="roles-error"></div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="btnSubmit" class="btn btn-primary">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
