<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo ingreso - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.min.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
<div th:replace="~{partials/session-guard :: guard}"></div>
</head>
<body>
    <div th:insert="~{partials/header :: header}"></div>
    <div class="page-shell">

        <div class="hero-panel">
            <span class="hero-kicker mb-2"><i class="bi bi-hospital"></i> Hospitalización</span>
            <h1 class="display-6 fw-bold mb-1">Registrar ingreso</h1>
        </div>

        <div class="surface-card p-4 p-md-5">
            <form th:action="@{/hospitalizacion/guardar}" th:object="${hospitalizacion}" method="post" class="row g-4">

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Mascota</label>
                    <select class="form-select form-select-lg" th:field="*{mascota.id}" required>
                        <option value="">Selecciona una mascota</option>
                        <option th:each="m : ${mascotas}" th:value="${m.id}" th:text="${m.nombre + ' (' + m.clienteNombre + ')'}"></option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('mascota')}" th:errors="*{mascota}"></div>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Jaula</label>
                    <input type="text" class="form-control form-control-lg" th:field="*{jaula}" maxlength="20" placeholder="Ej. A-03">
                    <div class="text-danger" th:if="${#fields.hasErrors('jaula')}" th:errors="*{jaula}"></div>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Veterinario responsable</label>
                    <select class="form-select form-select-lg" th:field="*{veterinarioResponsable.id}">
                        <option value="">Sin asignar</option>
                        <option th:each="v : ${veterinarios}" th:value="${v.id}" th:text="${v.name}"></option>
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold">Motivo de ingreso</label>
                    <input type="text" class="form-control form-control-lg" th:field="*{motivoIngreso}" maxlength="500" placeholder="Ej. Vómitos y decaimiento hace 2 días">
                    <div class="text-danger" th:if="${#fields.hasErrors('motivoIngreso')}" th:errors="*{motivoIngreso}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold">Diagnóstico de ingreso</label>
                    <textarea class="form-control" rows="2" th:field="*{diagnosticoIngreso}" maxlength="500"></textarea>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold">Tratamiento indicado</label>
                    <textarea class="form-control" rows="3" th:field="*{tratamientoGeneral}" maxlength="1000" placeholder="Fluidoterapia, antibiótico, dieta, etc."></textarea>
                </div>

                <h5 class="col-12 mb-0 mt-2"><i class="bi bi-heart-pulse me-1"></i> Signos vitales de ingreso</h5>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Peso (kg)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{pesoIngreso}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Temperatura (°C)</label>
                    <input type="number" step="0.1" class="form-control" th:field="*{temperaturaIngreso}">
                </div>

                <div class="col-12 d-flex justify-content-end gap-2">
                    <a th:href="@{/hospitalizacion}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Registrar ingreso</button>
                </div>
            </form>
        </div>
    </div>
    <div th:insert="~{partials/footer :: footer}"></div>
</body>
</html>
