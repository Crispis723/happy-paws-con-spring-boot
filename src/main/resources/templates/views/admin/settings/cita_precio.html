<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precio de Cita - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <style>
        body { min-height: 100vh; background: linear-gradient(180deg, #f8fdfd 0%, #eef8f7 100%); }
        .page-shell { max-width: 720px; margin: 0 auto; padding: 2rem 1rem 3rem; }
        .hero-panel { background: linear-gradient(135deg, #8adfd7 0%, #58b8c7 100%); color: white; border-radius: 28px; padding: 2rem; box-shadow: 0 22px 50px rgba(71, 150, 164, 0.12); margin-bottom: 1.5rem; }
        .surface-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border: 1px solid rgba(138, 223, 215, 0.22); border-radius: 24px; box-shadow: 0 16px 36px rgba(71, 150, 164, 0.08); overflow: hidden; }
    </style>
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="page-shell">
        <div class="hero-panel">
            <p class="text-uppercase small fw-semibold mb-1 opacity-75">Configuración</p>
            <h1 class="display-6 fw-bold mb-2">Precio de cita</h1>
            <p class="mb-0 opacity-75">Actualiza el valor por defecto de la cita médica.</p>
        </div>

        <div class="surface-card p-4 p-md-5">
            <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
            <form th:action="@{/admin/settings/cita_precio}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Precio (PEN)</label>
                    <input type="number" step="0.01" name="cita_precio" class="form-control form-control-lg" th:value="${precio}">
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/settings}" class="btn btn-outline-secondary">Cancelar</a>
                    <button class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
