<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar cita - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="container-fluid p-4">
        <div class="card">
            <div class="card-header"><h3 class="card-title mb-0">Formulario de cita</h3></div>
            <div class="card-body">
                <form th:action="@{/citas/guardar}" th:object="${cita}" method="post" class="row g-4">
                    <input type="hidden" th:field="*{id}">
                    <div class="col-md-6">
                        <label class="form-label">Cliente</label>
                        <select class="form-select" th:field="*{clienteId}">
                            <option value="">-- Seleccionar --</option>
                            <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.razonSocial}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mascota</label>
                        <select class="form-select" th:field="*{petId}">
                            <option value="">-- Seleccionar --</option>
                            <option th:each="mascota : ${mascotas}" th:value="${mascota.id}" th:text="${mascota.nombre + ' - ' + mascota.especie}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-control" th:field="*{fecha}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Motivo</label>
                        <textarea class="form-control" rows="4" th:field="*{motivo}"></textarea>
                    </div>
                    <div class="col-12 d-flex justify-content-between gap-2">
                        <a th:href="@{/citas}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar cita</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
