<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Citas</title>
</head>
<body>

<h1>Lista de Citas</h1>

<a href="/citas/nuevo">Nueva Cita</a>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Mascota</th>
        <th>Propietario</th>
        <th>Fecha</th>
        <th>Motivo</th>
        <th>Acciones</th>
    </tr>

    <tr th:each="c : ${citas}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.mascota}"></td>
        <td th:text="${c.propietario}"></td>
        <td th:text="${c.fecha}"></td>
        <td th:text="${c.motivo}"></td>

        <td>
            <a th:href="@{/citas/editar/{id}(id=${c.id})}">
                Editar
            </a>

            <a th:href="@{/citas/eliminar/{id}(id=${c.id})}">
                Eliminar
            </a>
        </td>
    </tr>

</table>

</body>
</html>
