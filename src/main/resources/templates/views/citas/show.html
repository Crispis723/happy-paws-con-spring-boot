<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de cita - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
    <style>
        body { min-height: 100vh; background: linear-gradient(180deg, #f8fdfd 0%, #eef8f7 100%); }
        .page-shell { max-width: 1180px; margin: 0 auto; padding: 2rem 1rem 3rem; }
        .surface-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border: 1px solid rgba(138, 223, 215, 0.22); border-radius: 24px; box-shadow: 0 16px 36px rgba(71, 150, 164, 0.08); overflow: hidden; }
        .hero-panel { background: linear-gradient(135deg, #8adfd7 0%, #58b8c7 100%); color: white; border-radius: 28px; padding: 2rem; box-shadow: 0 22px 50px rgba(71, 150, 164, 0.12); margin-bottom: 1.5rem; }
    </style>

<div th:replace="~{partials/session-guard :: guard}"></div>

</head>
<body>
    <div th:insert="~{partials/header :: header}"></div>
    <div class="page-shell">
        <div class="hero-panel d-flex justify-content-between align-items-center gap-3 flex-wrap">
            <div>
                <p class="text-uppercase small fw-semibold mb-1 opacity-75">Agenda médica</p>
                <h1 class="display-6 fw-bold mb-0">Detalle de cita</h1>
            </div>
            <span class="badge bg-light text-dark px-3 py-2">Programada</span>
        </div>

        <div class="surface-card p-4 p-md-5">
            <dl class="row mb-0">
                <dt class="col-sm-4 fw-bold">Fecha y hora</dt>
                <dd class="col-sm-8" th:text="${cita.fechaHora != null ? #temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm') : '-'}">-</dd>
                <dt class="col-sm-4 fw-bold">Cliente</dt>
                <dd class="col-sm-8" th:text="${cita.cliente != null ? cita.cliente.razonSocial : '-'}">-</dd>
                <dt class="col-sm-4 fw-bold">Mascota</dt>
                <dd class="col-sm-8"><strong th:text="${cita.mascota != null ? cita.mascota.nombre : '-'}">Mascota</strong></dd>
                <dt class="col-sm-4 fw-bold">Especie</dt>
                <dd class="col-sm-8" th:text="${cita.mascota != null ? cita.mascota.especie : '-'}">-</dd>
                <dt class="col-sm-4 fw-bold">Veterinario</dt>
                <dd class="col-sm-8" th:text="${cita.veterinario != null ? cita.veterinario.name : 'Sin asignar'}">-</dd>
                <dt class="col-sm-4 fw-bold">Motivo</dt>
                <dd class="col-sm-8" th:text="${cita.motivo}">-</dd>
            </dl>

            <div class="d-flex justify-content-between gap-2 mt-4">
                <a th:href="@{/citas}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
                <div class="d-flex gap-2">
                    <a th:href="@{/citas/edit/{id}(id=${cita.id})}" class="btn btn-primary"><i class="bi bi-pencil"></i> Editar</a>
                    <a th:href="@{/citas/delete/{id}(id=${cita.id})}" class="btn btn-danger" onclick="return confirm('¿Estás seguro de que deseas eliminar esta cita?');"><i class="bi bi-trash"></i> Eliminar</a>
                </div>
            </div>
        </div>
    </div>
    <div th:insert="~{partials/footer :: footer}"></div>
</body>
</html>
