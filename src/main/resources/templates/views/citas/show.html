<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Detalle de cita</title></head>
<body>
<div th:replace="~{views/plantilla/app :: content}">
    <div class="container-fluid"><div class="row g-4">
        <div class="col-xl-7"><div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center"><h5 class="mb-0"><i class="bi bi-calendar-check me-2"></i>Detalle de cita</h5><span class="badge bg-light text-dark" th:text="${cita.estadoDisplay}"></span></div>
            <div class="card-body"><dl class="row mb-0">
                <dt class="col-sm-4">Fecha y hora</dt><dd class="col-sm-8" th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}"></dd>
                <dt class="col-sm-4">Cliente</dt><dd class="col-sm-8" th:text="${cita.clienteNombre}"></dd>
                <dt class="col-sm-4">Teléfono</dt><dd class="col-sm-8" th:text="${cita.clienteTelefono ?: '-'}"></dd>
                <dt class="col-sm-4">Mascota</dt><dd class="col-sm-8" th:text="${cita.mascotaNombre}"></dd>
                <dt class="col-sm-4">Especie</dt><dd class="col-sm-8" th:text="${cita.mascotaEspecie}"></dd>
                <dt class="col-sm-4">Veterinario</dt><dd class="col-sm-8" th:text="${cita.veterinario != null ? cita.veterinario.nombreCompleto : 'Sin asignar'}"></dd>
                <dt class="col-sm-4">Motivo</dt><dd class="col-sm-8" th:text="${cita.motivo}"></dd>
                <dt class="col-sm-4">Precio</dt><dd class="col-sm-8" th:text="${cita.precio != null ? 'S/. ' + #numbers.formatDecimal(cita.precio, 1, 2) : '-'}"></dd>
                <dt class="col-sm-4" th:if="${cita.notas != null and !cita.notas.isBlank()}">Notas</dt><dd class="col-sm-8" th:if="${cita.notas != null and !cita.notas.isBlank()}" th:text="${cita.notas}"></dd>
            </dl><div class="d-flex justify-content-between gap-2 mt-4"><a th:href="@{/citas}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a><a th:href="@{/citas/{id}/edit(id=${cita.id})}" class="btn btn-primary"><i class="bi bi-pencil me-1"></i>Editar versión actual</a></div></div>
        </div></div>
        <div class="col-xl-5"><div class="card history-card"><div class="card-header"><h5 class="mb-1"><i class="bi bi-clock-history me-2"></i>Historial de cambios</h5><small class="text-muted">Las versiones anteriores son copias bloqueadas.</small></div><div class="card-body">
            <div th:if="${#lists.isEmpty(historial)}" class="text-muted">No hay versiones registradas.</div>
            <article class="version-snapshot" th:each="version : ${historial}"><div class="d-flex justify-content-between align-items-start gap-2"><strong th:text="|'Microversión ${version.versionNumber}'|"></strong><span class="badge bg-light text-dark" th:text="${version.versionNumber == 1 ? 'Inicial' : 'Bloqueada'}"></span></div><div class="small text-muted mb-2"><i class="bi bi-calendar3 me-1"></i><span th:text="${#temporals.format(version.cambiadoEn, 'dd/MM/yyyy HH:mm')}"></span><span class="mx-1">·</span><i class="bi bi-person me-1"></i><span th:text="${version.cambiadoPor}"></span></div><dl class="row small mb-0"><dt class="col-5">Estado</dt><dd class="col-7" th:text="${version.estado.displayName}"></dd><dt class="col-5">Motivo</dt><dd class="col-7 text-break" th:text="${version.motivo}"></dd><dt class="col-5">Notas</dt><dd class="col-7 text-break" th:text="${version.notas ?: '-'}"></dd></dl></article>
        </div></div></div>
    </div></div>
</div>
</body>
</html>
