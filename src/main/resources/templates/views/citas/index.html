<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.min.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">

<div th:replace="~{partials/session-guard :: guard}"></div>

</head>
<body>
    <div th:insert="~{partials/header :: header}"></div>
    <div class="page-shell">
        <div class="hero-panel d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
            <div>
                <span class="hero-kicker mb-2"><i class="bi bi-calendar-check"></i> Seguimiento</span>
                <h1 class="display-6 fw-bold mb-2">Mis citas</h1>
                <p class="mb-0 opacity-75">Revisa tus citas registradas y gestiona cambios rápidos.</p>
            </div>
            <div class="d-flex flex-column flex-sm-row gap-2">
                <a th:href="${isClientUser} ? @{/dashboard/cliente} : @{/dashboard}" class="btn btn-outline-light btn-lg rounded-pill fw-semibold px-4"><i class="bi bi-arrow-left me-1"></i> Regresar</a>
                <a th:href="@{/citas/create}" class="btn btn-light btn-lg rounded-pill fw-semibold text-info px-4"><i class="bi bi-plus-circle me-1"></i> Nueva cita</a>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="surface-card p-4">
            <div class="table-responsive">
                <table class="table table-striped table-hover table-sm align-middle">
                    <thead>
                        <tr>
                            <th>Fecha y hora</th>
                            <th>Cliente</th>
                            <th>Mascota</th>
                            <th>Servicio</th>
                            <th>Tipo de servicio</th>
                            <th>Veterinario</th>
                            <th>Motivo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(citas)}">
                            <td colspan="9" class="text-center text-muted py-4">No hay citas registradas</td>
                        </tr>
                        <tr th:each="cita : ${citas}">
                            <td th:text="${cita.fechaHora != null ? #temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm') : '--'}">--</td>
                            <td th:text="${cita.cliente != null ? cita.cliente.razonSocial : '-'}">--</td>
                            <td th:text="${cita.mascota != null ? cita.mascota.nombre : '-'}">--</td>
                            <td th:text="${cita.servicio ?: '-'}">--</td>
                            <td th:text="${cita.tipoServicio ?: '-'}">--</td>
                            <td th:text="${cita.veterinarioNombre != null and !cita.veterinarioNombre.isBlank() ? cita.veterinarioNombre : '-'}">--</td>
                            <td th:text="${cita.motivo}">--</td>
                            <td>
                                <span class="badge rounded-pill px-3 py-2"
                                      th:style="'background-color:' + ${cita.estado.colorHex} + ';color:#fff;'"
                                      th:text="${cita.estado.etiqueta}">Agendada</span>

                                <!-- Personal clínico: puede mover la cita a cualquier estado -->
                                <form th:if="${!isClientUser}" th:action="@{/citas/{id}/estado(id=${cita.id})}" method="post" class="mt-1">
                                    <select name="estado" class="form-select form-select-sm" style="width:auto;display:inline-block;" onchange="this.form.submit()">
                                        <option th:each="e : ${estados}" th:value="${e}" th:text="${e.etiqueta}"
                                                th:selected="${e == cita.estado}"></option>
                                    </select>
                                </form>

                                <!-- Cliente: solo puede cancelar su propia cita, y solo si aún no está cerrada -->
                                <form th:if="${isClientUser and !cita.estado.esFinal}" th:action="@{/citas/{id}/estado(id=${cita.id})}" method="post" class="mt-1">
                                    <input type="hidden" name="estado" value="CANCELADA">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Cancelar esta cita?');">Cancelar cita</button>
                                </form>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/citas/show/{id}(id=${cita.id})}" class="btn btn-sm btn-outline-info" title="Ver detalle"><i class="bi bi-eye"></i></a>
                                <a th:href="@{/citas/edit/{id}(id=${cita.id})}" class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/citas/delete/{id}(id=${cita.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar esta cita?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div th:insert="~{partials/footer :: footer}"></div>
</body>
</html>
