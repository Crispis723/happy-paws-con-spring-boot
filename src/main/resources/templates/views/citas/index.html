<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Citas</title></head>
<body>
<div th:replace="~{views/plantilla/app :: content}">
    <div class="container-fluid">
        <div class="card">
            <div class="card-header d-flex align-items-center"><h3 class="card-title flex-grow-1 mb-0"><i class="bi bi-calendar-check me-2"></i>Citas</h3><a th:href="@{/citas/create}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Nueva cita</a></div>
            <div class="card-body"><div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead><tr><th>Fecha y hora</th><th>Cliente</th><th>Teléfono</th><th>Mascota</th><th>Veterinario</th><th>Motivo</th><th>Estado</th><th>Precio</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(citas)}"><td colspan="9" class="text-center text-muted py-4">No hay citas registradas.</td></tr>
                    <tr th:each="cita : ${citas}">
                        <td th:text="${cita.fechaHora != null ? #temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                        <td th:text="${cita.clienteNombre ?: '-'}"></td>
                        <td th:text="${cita.clienteTelefono ?: '-'}"></td>
                        <td><span class="fw-semibold" th:text="${cita.mascotaNombre ?: '-'}"></span><small class="d-block text-muted" th:text="${cita.mascotaEspecie ?: ''}"></small></td>
                        <td th:text="${cita.veterinario != null ? cita.veterinario.nombreCompleto : 'Sin asignar'}"></td>
                        <td class="text-truncate" style="max-width: 220px" th:text="${cita.motivo}"></td>
                        <td><span class="badge bg-info" th:text="${cita.estadoDisplay}"></span></td>
                        <td th:text="${cita.precio != null ? 'S/. ' + #numbers.formatDecimal(cita.precio, 1, 2) : '-'}"></td>
                        <td class="text-end text-nowrap"><a th:href="@{/citas/{id}(id=${cita.id})}" class="btn btn-sm btn-outline-secondary" title="Ver"><i class="bi bi-eye"></i></a><a th:href="@{/citas/{id}/edit(id=${cita.id})}" class="btn btn-sm btn-outline-primary ms-1" title="Editar"><i class="bi bi-pencil"></i></a></td>
                    </tr>
                    </tbody>
                </table>
            </div></div>
        </div>
    </div>
</div>
</body>
</html>
