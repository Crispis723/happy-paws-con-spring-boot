<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="container-fluid p-4">
        <div class="card">
            <div class="card-header d-flex align-items-center">
                <h3 class="card-title flex-grow-1"><i class="bi bi-calendar-check"></i> Citas</h3>
                <a th:href="@{/citas/create}" class="btn btn-primary btn-sm"><i class="bi bi-plus-circle"></i> Nueva cita</a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-sm align-middle">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Cliente</th>
                                <th>Mascota</th>
                                <th>Motivo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(citas)}">
                                <td colspan="5" class="text-center text-muted py-4">No hay citas registradas</td>
                            </tr>
                            <tr th:each="cita : ${citas}">
                                <td th:text="${cita.fecha}">--</td>
                                <td th:text="${cita.cliente != null ? cita.cliente.razonSocial : '-'}">--</td>
                                <td th:text="${cita.mascota != null ? cita.mascota.nombre : '-'}">--</td>
                                <td th:text="${cita.motivo}">--</td>
                                <td class="text-center">
                                    <a th:href="@{/citas/edit/{id}(id=${cita.id})}" class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/citas/delete/{id}(id=${cita.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar esta cita?')"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
