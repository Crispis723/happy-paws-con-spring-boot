<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Cita</title>
    <style>
        :root {
            --primary-color: #B98BC9;
            --secondary-color: #7A1AC9;
            --bg-soft: #f7f4fb;
            --text-primary: #1f1f1f;
            --text-muted: #6b7280;
            --shadow-lg: 0 20px 50px rgba(122, 26, 201, 0.15);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            background: linear-gradient(180deg, #ffffff 0%, var(--bg-soft) 100%);
            padding: 40px 16px;
        }
        .shell { max-width: 1040px; margin: 0 auto; }
        .hero {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border-radius: 24px;
            padding: 28px 32px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 24px;
        }
        .hero .eyebrow {
            letter-spacing: .12em;
            text-transform: uppercase;
            font-size: .78rem;
            opacity: .8;
            margin: 0 0 8px;
        }
        .hero h1 { margin: 0 0 8px; font-size: 2rem; }
        .hero p { margin: 0; max-width: 72ch; opacity: .88; }
        .card {
            background: rgba(255,255,255,.9);
            border: 1px solid rgba(185, 139, 201, 0.18);
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        .card-header {
            padding: 18px 24px;
            background: white;
            border-bottom: 1px solid rgba(0,0,0,.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: .85rem;
            font-weight: 700;
            background: rgba(185, 139, 201, 0.14);
            color: var(--secondary-color);
        }
        form { padding: 28px 24px 32px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 18px;
        }
        .field { grid-column: span 12; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }
        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e6e0ef;
            border-radius: 14px;
            font: inherit;
            background: white;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(185, 139, 201, 0.16);
        }
        .actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 26px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 18px;
            border-radius: 14px;
            font-weight: 700;
            text-decoration: none;
            border: 0;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #fff;
        }
        .btn-secondary {
            background: #fff;
            color: var(--secondary-color);
            border: 1px solid #ddd6e7;
        }
        .invalid {
            margin-top: 8px;
            color: #b42318;
            font-size: .92rem;
        }
        @media (min-width: 768px) {
            .field.half { grid-column: span 6; }
        }
    </style>
</head>
<body>
<div class="shell">
    <section class="hero">
        <p class="eyebrow">Happy Paws</p>
        <h1>Formulario de cita</h1>
        <p>Agenda la atencion medica de una mascota con fecha, hora y veterinario asignado.</p>
    </section>

    <section class="card">
        <div class="card-header">
            <span class="pill">Nueva cita</span>
            <span style="color: var(--text-muted); font-weight: 600;">Registro inicial</span>
        </div>

        <form th:action="@{/citas/guardar}" th:object="${cita}" method="post">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{clienteId}">

            <div class="grid">
                <div class="field half">
                    <label>Mascota</label>
                    <select th:field="*{petId}" required>
                        <option value="">-- Seleccionar --</option>
                        <option th:each="mascota : ${mascotas}" th:value="${mascota.id}" th:text="${mascota.nombre + ' - ' + mascota.especie}"></option>
                    </select>
                </div>

                <div class="field half">
                    <label>Veterinario</label>
                    <select th:field="*{veterinarioId}" required>
                        <option value="">-- Seleccionar --</option>
                        <option th:each="veterinario : ${veterinarios}" th:value="${veterinario.id}" th:text="${veterinario.name}"></option>
                    </select>
                </div>

                <div class="field half">
                    <label>Fecha y hora</label>
                    <input type="datetime-local" th:field="*{fechaHora}" required>
                    <div class="invalid" th:if="${#fields.hasErrors('fechaHora')}" th:errors="*{fechaHora}"></div>
                </div>

                <div class="field half">
                    <label>Motivo</label>
                    <input type="text" th:field="*{motivo}" placeholder="Ej. Vacunacion" required>
                </div>
            </div>

            <div class="actions">
                <a th:href="@{/citas}" class="btn btn-secondary">Volver</a>
                <button type="submit" class="btn btn-primary">Guardar cita</button>
            </div>
        </form>
    </section>
</div>
</body>
</html>
