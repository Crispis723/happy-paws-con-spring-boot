<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar cita - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
    <style>
        body { min-height: 100vh; background: linear-gradient(180deg, #f8fdfd 0%, #eef8f7 100%); }
        .page-shell { max-width: 1180px; margin: 0 auto; padding: 2rem 1rem 3rem; }
        .hero-panel { background: linear-gradient(135deg, #8adfd7 0%, #58b8c7 100%); color: white; border-radius: 28px; padding: 2rem; box-shadow: 0 22px 50px rgba(71, 150, 164, 0.12); margin-bottom: 1.5rem; }
        .surface-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border: 1px solid rgba(138, 223, 215, 0.22); border-radius: 24px; box-shadow: 0 16px 36px rgba(71, 150, 164, 0.08); overflow: hidden; }
    </style>
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="page-shell">
        <div class="hero-panel">
            <p class="text-uppercase small fw-semibold mb-1 opacity-75">Agenda médica</p>
            <h1 class="display-6 fw-bold mb-2">Editar cita</h1>
            <p class="mb-0 opacity-75">Ajusta los datos de la cita sin cambiar la lógica del formulario.</p>
        </div>

        <div class="surface-card">
            <div class="card-header bg-white border-bottom-0 py-3">
                <h5 class="mb-0 text-primary fw-bold">Datos de la cita</h5>
            </div>
            <div class="card-body p-4 p-md-5">
                <form th:action="@{/citas}" method="post" novalidate class="row g-4">
                    <input type="hidden" name="id" th:value="${cita.id}">
                    <div class="col-12 col-lg-6">
                        <label class="form-label fw-semibold">Fecha y hora <span class="text-danger">*</span></label>
                        <input type="datetime-local" name="fecha_hora" class="form-control form-control-lg" th:value="${fecha_hora ?: cita.fecha_hora}">
                    </div>
                    <div class="col-12 col-lg-6">
                        <label class="form-label fw-semibold">Nombre del Cliente <span class="text-danger">*</span></label>
                        <input type="text" name="cliente_nombre" class="form-control form-control-lg" th:value="${cliente_nombre ?: cita.cliente_nombre}">
                    </div>
                    <div class="col-12 col-lg-6">
                        <label class="form-label fw-semibold">Teléfono <span class="text-danger">*</span></label>
                        <input type="tel" name="cliente_telefono" class="form-control form-control-lg" th:value="${cliente_telefono ?: cita.cliente_telefono}">
                    </div>
                    <div class="col-12 col-lg-6">
                        <label class="form-label fw-semibold">Estado <span class="text-danger">*</span></label>
                        <select name="estado" class="form-select form-select-lg">
                            <option value="pendiente" th:selected="${cita.estado == 'pendiente'}">Pendiente</option>
                            <option value="confirmada" th:selected="${cita.estado == 'confirmada'}">Confirmada</option>
                            <option value="completada" th:selected="${cita.estado == 'completada'}">Completada</option>
                            <option value="cancelada" th:selected="${cita.estado == 'cancelada'}">Cancelada</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <div class="border-top pt-3 mt-3">
                            <h6 class="mb-3">Información de la Mascota</h6>
                            <div class="row g-3">
                                <div class="col-12 col-lg-6">
                                    <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                                    <input type="text" name="mascota_nombre" class="form-control" th:value="${mascota_nombre ?: cita.mascota_nombre}">
                                </div>
                                <div class="col-12 col-lg-6">
                                    <label class="form-label fw-semibold">Especie <span class="text-danger">*</span></label>
                                    <input type="text" name="mascota_especie" class="form-control" th:value="${mascota_especie ?: cita.mascota_especie}">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Motivo de la Consulta <span class="text-danger">*</span></label>
                        <textarea name="motivo" class="form-control" rows="3" th:text="${motivo ?: cita.motivo}"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Precio</label>
                        <input type="number" step="0.01" name="precio" class="form-control" th:value="${precio ?: cita.precio}">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Notas Internas</label>
                        <textarea name="notas" class="form-control" rows="2" th:text="${notas ?: cita.notas}"></textarea>
                    </div>
                    <div class="col-12 d-flex justify-content-between gap-2 mt-4">
                        <a th:href="@{/citas}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Actualizar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
