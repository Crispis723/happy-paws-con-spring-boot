<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Editar cita</title></head>
<body>
<div th:replace="~{views/plantilla/app :: content}">
    <div class="container-fluid">
        <div class="row justify-content-center"><div class="col-xl-8 col-lg-10"><div class="card">
            <div class="card-header bg-primary text-white"><h5 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editar cita</h5></div>
            <div class="card-body">
                <form th:action="@{/citas/{id}(id=${appointment.id})}" th:object="${appointment}" method="post" novalidate>
                    <input type="hidden" name="_method" value="put">
                    <div class="row g-3">
                        <div class="col-md-6"><label for="fechaHora" class="form-label fw-bold">Fecha y hora <span class="text-danger">*</span></label><input id="fechaHora" type="datetime-local" th:field="*{fechaHora}" class="form-control" required></div>
                        <div class="col-md-6"><label for="estado" class="form-label fw-bold">Estado <span class="text-danger">*</span></label><select id="estado" th:field="*{estado}" class="form-select" required><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado.displayName}"></option></select></div>
                        <div class="col-md-6"><label for="clienteNombre" class="form-label fw-bold">Cliente</label><input id="clienteNombre" type="text" th:field="*{clienteNombre}" class="form-control" readonly></div>
                        <div class="col-md-6"><label for="clienteTelefono" class="form-label fw-bold">Teléfono</label><input id="clienteTelefono" type="tel" th:field="*{clienteTelefono}" class="form-control" readonly pattern="[0-9]{10}" maxlength="10" inputmode="numeric"></div>
                        <div class="col-md-6"><label for="mascotaNombre" class="form-label fw-bold">Mascota</label><input id="mascotaNombre" type="text" th:field="*{mascotaNombre}" class="form-control" readonly></div>
                        <div class="col-md-6"><label for="mascotaEspecie" class="form-label fw-bold">Especie</label><input id="mascotaEspecie" type="text" th:field="*{mascotaEspecie}" class="form-control" readonly></div>
                        <div class="col-12"><label for="motivo" class="form-label fw-bold">Motivo de la consulta <span class="text-danger">*</span></label><textarea id="motivo" th:field="*{motivo}" class="form-control" rows="3" required></textarea></div>
                        <div class="col-md-6"><label for="veterinario" class="form-label fw-bold">Veterinario</label><select id="veterinario" th:field="*{veterinario}" class="form-select"><option value="">Sin asignar</option><option th:each="veterinario : ${veterinarios}" th:value="${veterinario.id}" th:text="${veterinario.nombreCompleto}"></option></select></div>
                        <div class="col-md-6"><label for="precio" class="form-label fw-bold">Precio</label><input id="precio" type="number" step="0.01" min="0" th:field="*{precio}" class="form-control"></div>
                        <div class="col-12"><label for="notas" class="form-label fw-bold">Notas internas</label><textarea id="notas" th:field="*{notas}" class="form-control" rows="3"></textarea></div>
                    </div>
                    <div class="d-flex justify-content-between gap-2 mt-4"><a th:href="@{/citas/{id}(id=${appointment.id})}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Cancelar</a><button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>Guardar cambios</button></div>
                </form>
            </div>
        </div></div></div>
    </div>
</div>
</body>
</html>
