<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Afectación - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
    <style>
        body { min-height: 100vh; background: linear-gradient(180deg, #f8fdfd 0%, #eef8f7 100%); }
        .page-shell { max-width: 1180px; margin: 0 auto; padding: 2rem 1rem 3rem; }
        .hero-panel { background: linear-gradient(135deg, #8adfd7 0%, #58b8c7 100%); color: white; border-radius: 28px; padding: 2rem; box-shadow: 0 22px 50px rgba(71, 150, 164, 0.12); margin-bottom: 1.5rem; }
        .surface-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border: 1px solid rgba(138, 223, 215, 0.22); border-radius: 24px; box-shadow: 0 16px 36px rgba(71, 150, 164, 0.08); overflow: hidden; }
    </style>

<div th:replace="~{partials/session-guard :: guard}"></div>

</head>
<body>
    <div th:insert="~{partials/header :: header}"></div>
    <div class="page-shell">
        <div class="hero-panel">
            <p class="text-uppercase small fw-semibold mb-1 opacity-75">Configuración</p>
            <h1 class="display-6 fw-bold mb-2">Tipos de afectación</h1>
            <p class="mb-0 opacity-75">Catálogo fiscal para identificar la afectación de los comprobantes.</p>
        </div>

        <div class="surface-card">
            <div class="card-header bg-white border-bottom-0 py-3 d-flex align-items-center gap-2">
                <h5 class="card-title flex-grow-1 mb-0 text-primary fw-bold">Listado</h5>
                <button type="button" class="btn btn-primary rounded-pill">
                    <i class="bi bi-plus-circle me-1"></i> Nuevo
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 15%;">Opciones</th>
                                <th style="width: 12%;">Código</th>
                                <th style="width: 16%;">Nombre</th>
                                <th>Descripción</th>
                                <th style="width: 8%;">Letra</th>
                                <th style="width: 10%;">%</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${afectacionTipos == null or #lists.isEmpty(afectacionTipos)}">
                                <td colspan="6" class="text-center text-muted py-5">No hay registros disponibles.</td>
                            </tr>
                            <tr th:each="afectacionTipo : ${afectacionTipos}">
                                <td>
                                    <div class="d-flex gap-2">
                                        <button type="button" class="btn btn-sm btn-outline-primary">Editar</button>
                                        <button type="button" class="btn btn-sm btn-outline-danger">Eliminar</button>
                                    </div>
                                </td>
                                <td th:text="${afectacionTipo.codigo}">10</td>
                                <td th:text="${afectacionTipo.nombre}">Gravada</td>
                                <td th:text="${afectacionTipo.descripcion}">Operación gravada</td>
                                <td th:text="${afectacionTipo.letra}">G</td>
                                <td th:text="${afectacionTipo.porcentaje}">18</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div th:insert="~{partials/footer :: footer}"></div>
</body>
</html>
