<!-- Auth Modal - Login/Register (Thymeleaf) -->
<div th:fragment="authModal">
  <div class="auth-modal-overlay" id="authModalOverlay">
    <div class="auth-modal" id="authModal">
      <button class="auth-modal-close" type="button" onclick="closeAuthModal()">&times;</button>

      <div class="auth-modal-header">
        <img th:src="@{/assets/img/shared/logo.jpg}" alt="Happy Paws" class="auth-modal-logo">
        <h1 class="auth-modal-title">Happy Paws</h1>
        <p class="auth-modal-subtitle">Sistema de Gestión Veterinaria</p>
      </div>

      <div class="auth-modal-body">
        <!-- Login Form -->
        <div id="loginForm" class="auth-form">
          <h2>Iniciar Sesión</h2>

          <div class="auth-alert error" th:if="${error}">
            <strong>Error:</strong> <span th:text="${error}"></span>
          </div>

          <div class="auth-alert success" th:if="${success}">
            <strong>Éxito:</strong> <span th:text="${success}"></span>
          </div>

          <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
              <label for="loginEmail">Correo Electrónico</label>
              <input 
                type="email" 
                id="loginEmail" 
                name="email" 
                placeholder="tu@correo.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="loginPassword">Contraseña</label>
              <input 
                type="password" 
                id="loginPassword" 
                name="password" 
                placeholder="••••••••"
                required
              />
            </div>

            <button type="submit" class="auth-btn auth-btn-primary">Ingresar</button>
          </form>

          <div class="auth-links">
            <p><a href="#">¿Olvidaste tu contraseña?</a></p>
            <p class="auth-divider">o</p>
            <p class="auth-toggle-text">¿No tienes cuenta? <a href="#" class="auth-toggle-link" onclick="toggleForms('register')">Regístrate</a></p>
          </div>
        </div>

        <!-- Register Form (Hidden by default) -->
        <div id="registerForm" class="auth-form" style="display: none;">
          <h2>Crear Cuenta</h2>

          <div class="auth-alert success" th:if="${success}">
            <strong>Éxito:</strong> <span th:text="${success}"></span>
          </div>

          <form th:action="@{/register}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
              <label for="regName">Nombre Completo</label>
              <input type="text" id="regName" name="name" placeholder="Tu nombre" required />
            </div>

            <div class="form-group">
              <label for="regEmail">Correo Electrónico</label>
              <input type="email" id="regEmail" name="email" placeholder="tu@correo.com" required />
            </div>

            <div class="form-group">
              <label for="regPassword">Contraseña</label>
              <input type="password" id="regPassword" name="password" placeholder="••••••••" required />
            </div>

            <div class="form-group">
              <label for="regPasswordConfirm">Confirmar Contraseña</label>
              <input type="password" id="regPasswordConfirm" name="password_confirmation" placeholder="••••••••" required />
            </div>

            <button type="submit" class="auth-btn auth-btn-primary">Registrarse</button>
          </form>

          <div class="auth-links">
            <p class="auth-toggle-text">¿Ya tienes cuenta? <a href="#" class="auth-toggle-link" onclick="toggleForms('login')">Inicia sesión</a></p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script th:inline="javascript">
    function showAuthForm(formName) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const showLogin = formName !== 'register';

      loginForm.style.display = showLogin ? 'block' : 'none';
      registerForm.style.display = showLogin ? 'none' : 'block';
    }

    function openAuthModal(formName = 'login') {
      showAuthForm(formName);
      document.getElementById('authModalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeAuthModal() {
      document.getElementById('authModalOverlay').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function toggleForms(formName = 'login') {
      showAuthForm(formName);
    }

    document.addEventListener('click', function(e) {
      const overlay = document.getElementById('authModalOverlay');
      if (overlay && e.target === overlay) closeAuthModal();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeAuthModal();
    });

    document.addEventListener('DOMContentLoaded', function () {
      const authOpen = /*[[${authOpen}]]*/ false;
      const authForm = /*[[${authForm}]]*/ 'login';

      if (authOpen) {
        openAuthModal(authForm);
      }
    });
  </script>
</div>
