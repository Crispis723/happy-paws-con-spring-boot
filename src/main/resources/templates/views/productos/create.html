<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear producto - Happy Paws</title>

    <link rel="stylesheet"
          th:href="@{/css/adminlte.css}">

    <link rel="stylesheet"
          th:href="@{/css/happypaws-ui.css}">

    <link rel="stylesheet"
          th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">

</head>

<body>

    <!-- ===================================================== -->
    <!-- PROTECCIÓN DE SESIÓN -->
    <!-- ===================================================== -->

    <div th:replace="~{partials/session-guard :: guard}"></div>


    <!-- ===================================================== -->
    <!-- HEADER -->
    <!-- ===================================================== -->

    <div th:insert="~{partials/header :: header}"></div>


    <div class="page-shell">


        <!-- ===================================================== -->
        <!-- ENCABEZADO -->
        <!-- ===================================================== -->

        <div class="hero-panel d-flex flex-column flex-lg-row
                    align-items-lg-center justify-content-between gap-3">

            <div>

                <span class="hero-kicker mb-2">
                    <i class="bi bi-box-seam-fill"></i>
                    Inventario
                </span>

                <h1 class="display-6 fw-bold mb-2">
                    Crear nuevo producto
                </h1>

                <p class="mb-0 opacity-75">
                    Registra artículos con una vista clara y consistente
                    con el resto del sistema.
                </p>

            </div>


            <a th:href="@{/productos}"
               class="btn btn-light btn-lg rounded-pill
                      fw-semibold text-info px-4">

                <i class="bi bi-arrow-left me-1"></i>
                Volver

            </a>

        </div>



        <!-- ===================================================== -->
        <!-- TARJETA DEL FORMULARIO -->
        <!-- ===================================================== -->

        <div class="surface-card p-4 p-md-5">


            <!-- ================================================= -->
            <!-- FORMULARIO -->
            <!-- ================================================= -->

            <form th:action="@{/productos}"
                  th:object="${producto}"
                  method="post"
                  enctype="multipart/form-data"
                  class="row g-4">


                <!-- ================================================= -->
                <!-- ERRORES GENERALES -->
                <!-- ================================================= -->

                <div class="col-12"
                     th:if="${error != null}">

                    <div class="alert alert-danger"
                         th:text="${error}">
                    </div>

                </div>


                <!-- ================================================= -->
                <!-- ERROR UNIDAD -->
                <!-- ================================================= -->

                <div class="col-12"
                     th:if="${errorUnidad != null}">

                    <div class="alert alert-danger"
                         th:text="${errorUnidad}">
                    </div>

                </div>


                <!-- ================================================= -->
                <!-- ERROR AFECTACIÓN -->
                <!-- ================================================= -->

                <div class="col-12"
                     th:if="${errorAfectacion != null}">

                    <div class="alert alert-danger"
                         th:text="${errorAfectacion}">
                    </div>

                </div>


                <!-- ================================================= -->
                <!-- ID DEL PRODUCTO -->
                <!-- ================================================= -->

                <input type="hidden"
                       th:field="*{idProducto}">



                <!-- ================================================= -->
                <!-- CÓDIGO -->
                <!-- ================================================= -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Código
                    </label>

                    <input type="text"
                           th:field="*{codigo}"
                           class="form-control form-control-lg"
                           placeholder="Ej. PRD-001">

                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('codigo')}"
                         th:errors="*{codigo}">
                    </div>

                </div>



                <!-- ================================================= -->
                <!-- NOMBRE -->
                <!-- ================================================= -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Nombre
                    </label>

                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control form-control-lg"
                           placeholder="Ej. Producto A">

                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('nombre')}"
                         th:errors="*{nombre}">
                    </div>

                </div>



                <!-- ================================================= -->
                <!-- DESCRIPCIÓN -->
                <!-- ================================================= -->

                <div class="col-12">

                    <label class="form-label fw-semibold">
                        Descripción
                    </label>

                    <textarea th:field="*{descripcion}"
                              class="form-control"
                              rows="4"
                              placeholder="Descripción detallada del producto"></textarea>

                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('descripcion')}"
                         th:errors="*{descripcion}">
                    </div>

                </div>



                <!-- ================================================= -->
                <!-- UNIDAD -->
                <!-- ================================================= -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Unidad
                    </label>

                    <select th:field="*{unidad.idUnidad}"
                            class="form-select form-select-lg">

                        <option value="">
                            -- Seleccionar unidad --
                        </option>

                        <option th:each="unidad : ${unidades}"
                                th:value="${unidad.idUnidad}"
                                th:text="${unidad.codigo + ' - ' + unidad.descripcion}">
                        </option>

                    </select>


                    <div class="text-danger small mt-1"
                         th:if="${errorUnidad != null}"
                         th:text="${errorUnidad}">
                    </div>


                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('unidad')}"
                         th:errors="*{unidad}">
                    </div>

                </div>



                <!-- ================================================= -->
                <!-- TIPO DE AFECTACIÓN -->
                <!-- ================================================= -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Tipo afectación
                    </label>

                    <select th:field="*{afectacionTipo.idAfectacionTipo}"
                            class="form-select form-select-lg">

                        <option value="">
                            -- Seleccionar tipo --
                        </option>

                        <option th:each="tipo : ${afectacionTipos}"
                                th:value="${tipo.idAfectacionTipo}"
                                th:text="${tipo.codigo + ' - ' + tipo.descripcion}">
                        </option>

                    </select>


                    <div class="text-danger small mt-1"
                         th:if="${errorAfectacion != null}"
                         th:text="${errorAfectacion}">
                    </div>


                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('afectacionTipo')}"
                         th:errors="*{afectacionTipo}">
                    </div>

                </div>



                <!-- ================================================= -->
                <!-- PRECIO UNITARIO -->
                <!-- ================================================= -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Precio unitario
                    </label>

                    <div class="input-group input-group-lg">

                        <span class="input-group-text">
                            $
                        </span>

                        <input type="number"
                               th:field="*{precioUnitario}"
                               class="form-control"
                               step="0.01"
                               min="0">

                    </div>


                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('precioUnitario')}"
                         th:errors="*{precioUnitario}">
                    </div>

                </div>



                <!-- ================================================= -->
                <!-- STOCK -->
                <!-- ================================================= -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Stock inicial
                    </label>

                    <input type="number"
                           th:field="*{stock}"
                           class="form-control form-control-lg"
                           step="1"
                           min="0">


                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('stock')}"
                         th:errors="*{stock}">
                    </div>

                </div>



                <!-- ================================================= -->
                <!-- IMAGEN -->
                <!-- ================================================= -->

                <div class="col-12">

                    <label class="form-label fw-semibold">
                        Imagen del producto
                    </label>

                    <input type="file"
                           name="imagenArchivo"
                           class="form-control"
                           accept="image/jpeg,image/png,image/jpg">

                    <small class="text-muted">
                        JPG, JPEG o PNG. Máximo 2MB.
                    </small>

                </div>



                <!-- ================================================= -->
                <!-- BOTONES -->
                <!-- ================================================= -->

                <div class="col-12 d-flex justify-content-end
                            gap-2 pt-2">


                    <a th:href="@{/productos}"
                       class="btn btn-outline-secondary
                              btn-lg px-4">

                        <i class="bi bi-x-circle me-1"></i>

                        Cancelar

                    </a>


                    <button type="submit"
                            class="btn btn-primary
                                   btn-lg px-4">

                        <i class="bi bi-save me-1"></i>

                        Crear producto

                    </button>

                </div>


            </form>

        </div>

    </div>



    <!-- ===================================================== -->
    <!-- FOOTER -->
    <!-- ===================================================== -->

    <div th:insert="~{partials/footer :: footer}"></div>


</body>

</html>
