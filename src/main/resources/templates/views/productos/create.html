<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear producto - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="page-shell">
        <div class="hero-panel d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
            <div>
                <span class="hero-kicker mb-2"><i class="bi bi-box-seam-fill"></i> Inventario</span>
                <h1 class="display-6 fw-bold mb-2">Crear nuevo producto</h1>
                <p class="mb-0 opacity-75">Registra artículos con una vista clara y consistente con el resto del sistema.</p>
            </div>
            <a th:href="@{/productos}" class="btn btn-light btn-lg rounded-pill fw-semibold text-info px-4"><i class="bi bi-arrow-left me-1"></i> Volver</a>
        </div>

        <div class="surface-card p-4 p-md-5">
            <form th:action="@{/productos}" method="post" enctype="multipart/form-data" novalidate class="row g-4">
                <input type="hidden" name="id" th:value="${producto?.id}">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Código</label>
                    <input type="text" name="codigo" class="form-control form-control-lg" th:value="${producto?.codigo}" placeholder="Ej. PRD-001">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nombre</label>
                    <input type="text" name="nombre" class="form-control form-control-lg" th:value="${producto?.nombre}" placeholder="Ej. Producto A">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="4" placeholder="Descripción detallada del producto" th:text="${producto?.descripcion}"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Unidad</label>
                    <select name="unidad.id" class="form-select form-select-lg">
                        <option value="">-- Seleccionar unidad --</option>
                        <option th:each="unidad : ${unidades}" th:value="${unidad.id}" th:text="${unidad.codigo + ' - ' + unidad.descripcion}" th:selected="${producto != null and producto.unidad != null and producto.unidad.id == unidad.id}">Unidad</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Tipo afectación</label>
                    <select name="afectacionTipo.id" class="form-select form-select-lg">
                        <option value="">-- Seleccionar tipo --</option>
                        <option th:each="tipo : ${afectacionTipos}" th:value="${tipo.id}" th:text="${tipo.codigo + ' - ' + tipo.descripcion}" th:selected="${producto != null and producto.afectacionTipo != null and producto.afectacionTipo.id == tipo.id}">Tipo</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Precio unitario</label>
                    <div class="input-group input-group-lg"><span class="input-group-text">S/.</span><input type="number" name="precioUnitario" class="form-control" th:value="${producto?.precioUnitario}" step="0.01" min="0"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Stock inicial</label>
                    <input type="number" name="stock" class="form-control form-control-lg" th:value="${producto?.stock ?: 0}" step="1" min="0">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Imagen del producto</label>
                    <input type="file" name="imagen" class="form-control" accept="image/jpeg,image/png,image/jpg">
                    <small class="text-muted">JPG, JPEG o PNG. Máximo 2MB.</small>
                </div>
                <div class="col-12 d-flex justify-content-end gap-2 pt-2">
                    <a th:href="@{/productos}" class="btn btn-outline-secondary btn-lg px-4">Cancelar</a>
                    <button type="submit" class="btn btn-primary btn-lg px-4">Crear producto</button>
                </div>
            </form>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
