<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar producto - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
    <style>
        body { min-height: 100vh; background: linear-gradient(180deg, #f8fdfd 0%, #eef8f7 100%); }
        .page-shell { max-width: 1180px; margin: 0 auto; padding: 2rem 1rem 3rem; }
        .hero-panel { background: linear-gradient(135deg, #8adfd7 0%, #58b8c7 100%); color: white; border-radius: 28px; padding: 2rem; box-shadow: 0 22px 50px rgba(71, 150, 164, 0.12); margin-bottom: 1.5rem; }
        .surface-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border: 1px solid rgba(138, 223, 215, 0.22); border-radius: 24px; box-shadow: 0 16px 36px rgba(71, 150, 164, 0.08); overflow: hidden; }
        .surface-card .card-header { background: white; border-bottom: 1px solid rgba(0,0,0,.06); padding: 1rem 1.25rem; }
    </style>
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="page-shell">
        <div class="hero-panel">
            <p class="text-uppercase small fw-semibold mb-1 opacity-75">Inventario</p>
            <h1 class="display-6 fw-bold mb-2">Editar producto</h1>
            <p class="mb-0 opacity-75">Actualiza la información del inventario sin romper la jerarquía visual del sistema.</p>
        </div>

        <div class="surface-card">
            <div class="card-header">
                <h5 class="mb-0 text-primary fw-bold"><i class="bi bi-pencil me-1"></i> Datos del producto</h5>
            </div>
            <div class="card-body p-4 p-md-5">
                <form th:action="@{/productos}" method="post" enctype="multipart/form-data" novalidate class="row g-4">
                    <input type="hidden" name="id" th:value="${producto.id}">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Código <span class="text-danger">*</span></label>
                        <input type="text" name="codigo" class="form-control form-control-lg" th:value="${producto.codigo}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                        <input type="text" name="nombre" class="form-control form-control-lg" th:value="${producto.nombre}">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="4" th:text="${producto.descripcion}"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Unidad <span class="text-danger">*</span></label>
                        <select name="unidad.id" class="form-select form-select-lg">
                            <option value="">-- Seleccionar unidad --</option>
                            <option th:each="unidad : ${unidades}" th:value="${unidad.id}" th:text="${unidad.codigo + ' - ' + unidad.descripcion}" th:selected="${producto.unidad != null and producto.unidad.id == unidad.id}">Unidad</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tipo afectación <span class="text-danger">*</span></label>
                        <select name="afectacionTipo.id" class="form-select form-select-lg">
                            <option value="">-- Seleccionar tipo --</option>
                            <option th:each="tipo : ${afectacionTipos}" th:value="${tipo.id}" th:text="${tipo.codigo + ' - ' + tipo.descripcion}" th:selected="${producto.afectacionTipo != null and producto.afectacionTipo.id == tipo.id}">Tipo</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Precio unitario <span class="text-danger">*</span></label>
                        <div class="input-group input-group-lg"><span class="input-group-text">S/.</span><input type="number" name="precioUnitario" class="form-control" th:value="${producto.precioUnitario}" step="0.01" min="0"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Stock <span class="text-danger">*</span></label>
                        <input type="number" name="stock" class="form-control form-control-lg" th:value="${producto.stock}" step="1" min="0">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Imagen del producto</label>
                        <div class="mb-3" th:if="${producto.imagen != null}">
                            <img th:src="@{'/uploads/productos/' + ${producto.imagen}}" th:alt="${producto.nombre}" class="img-thumbnail rounded-4" style="max-width: 200px; max-height: 200px; border-color: rgba(138, 223, 215, 0.3);">
                        </div>
                        <input type="file" name="imagen" class="form-control" accept="image/jpeg,image/png,image/jpg">
                        <small class="text-muted">JPG, JPEG o PNG. Máximo 2MB. Deja en blanco si no deseas cambiarla.</small>
                    </div>
                    <div class="col-12 d-flex flex-column flex-sm-row justify-content-between gap-2 pt-2">
                        <a th:href="@{/productos}" class="btn btn-outline-secondary btn-lg px-4"><i class="bi bi-arrow-left me-1"></i> Cancelar</a>
                        <button type="submit" class="btn btn-primary btn-lg px-4"><i class="bi bi-check-circle me-1"></i> Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
