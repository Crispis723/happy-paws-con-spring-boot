<div xmlns:th="http://www.thymeleaf.org" th:fragment="actionModal">
    <div class="modal fade" id="modalUpdate" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <form id="formUpdate" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">
                    <input type="hidden" id="method_field" name="_method">
                    <div class="modal-header bg-primary text-white">
                        <h4 class="modal-title fs-5" id="modalTitle">Nuevo producto</h4>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="unidad_codigo" class="form-label fw-semibold">Unidad <span class="text-danger">*</span></label>
                                <input type="text" id="unidad_codigo" name="unidad_codigo" class="form-control" placeholder="NIU" required>
                            </div>
                            <div class="col-md-6">
                                <label for="afectacion_tipo_codigo" class="form-label fw-semibold">Afectación tipo <span class="text-danger">*</span></label>
                                <input type="text" id="afectacion_tipo_codigo" name="afectacion_tipo_codigo" class="form-control" placeholder="10" required>
                            </div>
                            <div class="col-md-6">
                                <label for="codigo" class="form-label fw-semibold">Código <span class="text-danger">*</span></label>
                                <input type="text" id="codigo" name="codigo" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="nombre" class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                                <input type="text" id="nombre" name="nombre" class="form-control" required>
                            </div>
                            <div class="col-12">
                                <label for="descripcion" class="form-label fw-semibold">Descripción</label>
                                <input type="text" id="descripcion" name="descripcion" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label for="precio_unitario" class="form-label fw-semibold">Precio unitario <span class="text-danger">*</span></label>
                                <input type="number" id="precio_unitario" name="precio_unitario" class="form-control" min="0" step="0.01" required>
                            </div>
                            <div class="col-md-4">
                                <label for="stock" class="form-label fw-semibold">Stock <span class="text-danger">*</span></label>
                                <input type="number" id="stock" name="stock" class="form-control" min="0" step="1" required>
                            </div>
                            <div class="col-md-4">
                                <label for="imagen" class="form-label fw-semibold">Imagen</label>
                                <input type="file" id="imagen" name="imagen" class="form-control">
                            </div>
                            <div class="col-12" th:if="${imagenProducto != null}">
                                <img th:src="${imagenProducto}" width="200" alt="Imagen del producto" class="img-fluid rounded-3">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="btnSubmit" class="btn btn-primary">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
