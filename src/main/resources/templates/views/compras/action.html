<div xmlns:th="http://www.thymeleaf.org" th:fragment="actionModal">
    <div class="modal fade" id="modalUpdate" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <form id="formUpdate" method="post">
                    <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">
                    <input type="hidden" id="method_field" name="_method">

                    <div class="modal-header border-0 bg-light">
                        <div>
                            <p class="text-uppercase small fw-semibold mb-1 text-primary">Compras</p>
                            <h4 class="modal-title fs-5 mb-0" id="modalTitle">Nuevo registro</h4>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body p-4 p-md-5">
                        <div class="row g-4">
                            <div class="col-lg-6">
                                <div class="p-3 border rounded-4 h-100 bg-white">
                                    <h6 class="fw-bold text-primary mb-3">Comprobante</h6>
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Tipo comprobante</label>
                                        <input type="text" class="form-control" name="comprobante_tipo_codigo" placeholder="01 - Factura">
                                    </div>
                                    <div class="mb-0">
                                        <label class="form-label fw-semibold">Serie</label>
                                        <input type="text" class="form-control" name="serie" placeholder="F001">
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="p-3 border rounded-4 h-100 bg-white">
                                    <h6 class="fw-bold text-primary mb-3">Proveedor</h6>
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Proveedor</label>
                                        <input type="text" class="form-control" name="proveedor_nombre" placeholder="Buscar o registrar proveedor">
                                    </div>
                                    <div class="mb-0">
                                        <label class="form-label fw-semibold">Documento</label>
                                        <input type="text" class="form-control" name="proveedor_documento" placeholder="Número de documento">
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="border border-primary rounded-4 p-3 bg-white">
                                    <div class="row g-2 align-items-center">
                                        <div class="col-md-8">
                                            <label class="form-label fw-semibold">Buscar producto</label>
                                            <input type="text" id="producto_nombre" class="form-control" placeholder="Buscar producto" autocomplete="off">
                                            <input type="hidden" id="producto_id" name="producto_id">
                                        </div>
                                        <div class="col-md-4 d-grid mt-md-4">
                                            <button type="button" id="btnAgregarProducto" class="btn btn-success">Agregar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="p-3 border rounded-4 bg-light">
                                    <p class="text-muted mb-2 small">Detalle de productos</p>
                                    <div class="table-responsive">
                                        <table class="table table-sm align-middle mb-0">
                                            <thead>
                                                <tr>
                                                    <th>Producto</th>
                                                    <th class="text-center">Cant.</th>
                                                    <th class="text-end">P. Unit.</th>
                                                    <th class="text-end">Total</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <td colspan="4" class="text-muted text-center py-4">Los detalles se cargarán aquí.</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer border-0 bg-light">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="btnSubmit" class="btn btn-primary">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
