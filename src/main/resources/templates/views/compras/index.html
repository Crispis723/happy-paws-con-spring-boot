<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
    <style>
        body { min-height: 100vh; background: linear-gradient(180deg, #f8fdfd 0%, #eef8f7 100%); }
        .page-shell { max-width: 1320px; margin: 0 auto; padding: 2rem 1rem 3rem; }
        .hero-panel { background: linear-gradient(135deg, #8adfd7 0%, #58b8c7 100%); color: white; border-radius: 28px; padding: 2rem; box-shadow: 0 22px 50px rgba(71, 150, 164, 0.12); margin-bottom: 1.5rem; }
        .hero-kicker { display: inline-flex; align-items: center; gap: .5rem; padding: .35rem .8rem; border-radius: 999px; background: rgba(255,255,255,0.18); font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        .surface-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border: 1px solid rgba(138, 223, 215, 0.22); border-radius: 24px; box-shadow: 0 16px 36px rgba(71, 150, 164, 0.08); overflow: hidden; }
        .surface-card .card-header { background: white; border-bottom: 1px solid rgba(0,0,0,.06); padding: 1rem 1.25rem; }
        .table thead th { background: linear-gradient(135deg, #8adfd7, #58b8c7); color: white; border: 0; }
        .table tbody tr:hover { background: #f5fbfb; }
    </style>
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="page-shell">
        <div class="hero-panel d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
            <div>
                <span class="hero-kicker mb-2">Compras</span>
                <h1 class="display-6 fw-bold mb-2">Registro de compras</h1>
                <p class="mb-0 opacity-75">Un listado más limpio para revisar proveedor, fecha, total y estado.</p>
            </div>
            <a th:href="@{/compras/create}" class="btn btn-light btn-lg rounded-pill fw-semibold text-info px-4"><i class="bi bi-plus-circle me-1"></i> Nueva compra</a>
        </div>
        <div class="surface-card">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h3 class="h5 mb-0 fw-bold text-primary"><i class="bi bi-cart-check me-1"></i> Listado de compras</h3>
                <span class="text-muted small">Historial y operaciones rápidas</span>
            </div>
            <div class="card-body p-0 p-md-3">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead><tr><th>Número</th><th>Proveedor</th><th>Fecha</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(compras)}"><td colspan="6" class="text-center text-muted py-4">No hay compras registradas</td></tr>
                            <tr th:each="compra : ${compras}">
                                <td th:text="${compra.numero}">--</td>
                                <td th:text="${compra.proveedorNombre}">--</td>
                                <td th:text="${compra.fecha}">--</td>
                                <td th:text="${'S/. ' + #numbers.formatDecimal(compra.total, 1, 'COMMA', 2, 'POINT')}">--</td>
                                <td><span class="badge bg-primary" th:text="${compra.estado}">Pendiente</span></td>
                                <td class="text-center">
                                    <a th:href="@{/compras/{id}(id=${compra.id})}" class="btn btn-sm btn-outline-info" title="Ver"><i class="bi bi-eye"></i></a>
                                    <a th:href="@{/compras/edit/{id}(id=${compra.id})}" class="btn btn-sm btn-outline-warning" title="Editar"><i class="bi bi-pencil"></i></a>
                                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="if(confirm('¿Está seguro?')) window.location.href=this.dataset.url;" th:data-url="@{/compras/delete/{id}(id=${compra.id})}" title="Eliminar"><i class="bi bi-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
