<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes Médicos - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
    <style>
        body { min-height: 100vh; background: linear-gradient(180deg, #f8fdfd 0%, #eef8f7 100%); }
        .page-shell { max-width: 1180px; margin: 0 auto; padding: 2rem 1rem 3rem; }
        .surface-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border: 1px solid rgba(138, 223, 215, 0.22); border-radius: 24px; box-shadow: 0 16px 36px rgba(71, 150, 164, 0.08); height: 100%; }
    </style>

<div th:replace="~{partials/session-guard :: guard}"></div>

</head>
<body>
<div th:insert="~{partials/header :: header}"></div>
<div class="page-shell">
    <div class="mb-4 d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
        <div>
            <h2 class="fw-bold"><i class="bi bi-clipboard-pulse text-danger me-2"></i>Reportes Médicos</h2>
            <p class="text-muted mb-0">Estadísticas e historiales de consultas veterinarias.</p>
        </div>
        <a th:href="@{/dashboard/colaboradores}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Regresar
        </a>
    </div>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="surface-card p-4 h-100">
                <h5 class="card-title"><i class="bi bi-calendar-check text-success me-2"></i>Historial de Citas</h5>
                <p class="card-text">Consultas realizadas y programadas.</p>
                <a th:href="@{/citas}" class="btn btn-primary">Ver Citas</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="surface-card p-4 h-100">
                <h5 class="card-title"><i class="bi bi-heart-pulse text-danger me-2"></i>Mascotas Atendidas</h5>
                <p class="card-text">Registro de pacientes.</p>
                <a th:href="@{/mascotas}" class="btn btn-primary">Ver Mascotas</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="surface-card p-4 h-100">
                <h5 class="card-title"><i class="bi bi-pie-chart text-info me-2"></i>Estadísticas</h5>
                <p class="card-text">Métricas de atención veterinaria.</p>
                <button type="button" class="btn btn-primary" disabled>Próximamente</button>
            </div>
        </div>
    </div>
</div>
<div th:insert="~{partials/footer :: footer}"></div>
</body>
</html>
