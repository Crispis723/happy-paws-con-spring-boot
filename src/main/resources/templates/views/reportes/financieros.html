<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes Financieros - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
    <style>
        body { min-height: 100vh; background: linear-gradient(180deg, #f8fdfd 0%, #eef8f7 100%); }
        .page-shell { max-width: 1180px; margin: 0 auto; padding: 2rem 1rem 3rem; }
        .surface-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border: 1px solid rgba(138, 223, 215, 0.22); border-radius: 24px; box-shadow: 0 16px 36px rgba(71, 150, 164, 0.08); height: 100%; }
    </style>
</head>
<body>
<div th:insert="partials/header :: header"></div>
<div class="page-shell">
    <div class="mb-4">
        <h2 class="fw-bold"><i class="bi bi-graph-up-arrow text-primary me-2"></i>Reportes Financieros</h2>
        <p class="text-muted mb-0">Análisis de ventas, compras y balance general.</p>
    </div>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="surface-card p-4 h-100">
                <h5 class="card-title"><i class="bi bi-cash-coin text-success me-2"></i>Ventas</h5>
                <p class="card-text">Resumen de ventas por período.</p>
                <a th:href="@{/reportes/ventas}" class="btn btn-primary">Ver Reporte</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="surface-card p-4 h-100">
                <h5 class="card-title"><i class="bi bi-bar-chart text-info me-2"></i>Balance General</h5>
                <p class="card-text">Ingresos vs Egresos.</p>
                <a href="#" class="btn btn-primary" onclick="return false;">Próximamente</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="surface-card p-4 h-100">
                <h5 class="card-title"><i class="bi bi-box-seam text-warning me-2"></i>Inventario</h5>
                <p class="card-text">Estado de productos y stock.</p>
                <a th:href="@{/productos}" class="btn btn-primary">Ver Productos</a>
            </div>
        </div>
    </div>
</div>
<div th:insert="partials/footer :: footer"></div>
</body>
</html>
