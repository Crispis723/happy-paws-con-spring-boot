<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Mascota</title>
    <style>
        :root {
            --primary-color: #B98BC9;
            --secondary-color: #7A1AC9;
            --accent-color: #D6A469;
            --bg-soft: #f7f4fb;
            --text-primary: #1f1f1f;
            --text-muted: #6b7280;
            --shadow-lg: 0 20px 50px rgba(122, 26, 201, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(185, 139, 201, 0.18), transparent 32%),
                radial-gradient(circle at top right, rgba(214, 164, 105, 0.16), transparent 28%),
                linear-gradient(180deg, #ffffff 0%, var(--bg-soft) 100%);
            padding: 40px 16px;
        }

        .shell {
            max-width: 920px;
            margin: 0 auto;
        }

        .hero {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border-radius: 24px;
            padding: 28px 32px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 24px;
        }

        .hero .eyebrow {
            letter-spacing: .12em;
            text-transform: uppercase;
            font-size: .78rem;
            opacity: .8;
            margin: 0 0 8px;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 2rem;
        }

        .hero p {
            margin: 0;
            max-width: 60ch;
            opacity: .88;
        }

        .card {
            background: rgba(255,255,255,.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(185, 139, 201, 0.18);
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .card-header {
            padding: 18px 24px;
            background: white;
            border-bottom: 1px solid rgba(0,0,0,.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: .85rem;
            font-weight: 700;
        }

        .pill.primary {
            background: rgba(185, 139, 201, 0.14);
            color: var(--secondary-color);
        }

        form {
            padding: 28px 24px 32px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 18px;
        }

        .field {
            grid-column: span 12;
        }

        .field.half {
            grid-column: span 12;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text-primary);
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e6e0ef;
            border-radius: 14px;
            font: inherit;
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(185, 139, 201, 0.16);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 26px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 18px;
            border-radius: 14px;
            font-weight: 700;
            text-decoration: none;
            border: 0;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #fff;
            box-shadow: 0 10px 24px rgba(122, 26, 201, 0.18);
        }

        .btn-secondary {
            background: #fff;
            color: var(--secondary-color);
            border: 1px solid #ddd6e7;
        }

        .help {
            margin-top: 8px;
            color: var(--text-muted);
            font-size: .92rem;
        }

        .error {
            margin-top: 8px;
            color: #b42318;
            font-size: .92rem;
        }

        @media (min-width: 768px) {
            .field.half {
                grid-column: span 6;
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <section class="hero">
        <p class="eyebrow">Happy Paws</p>
        <h1>Formulario de mascota</h1>
        <p>Captura los datos básicos con una presentación clara y alineada al resto del proyecto.</p>
    </section>

    <section class="card">
        <div class="card-header">
            <span class="pill primary">Nueva mascota</span>
            <span style="color: var(--text-muted); font-weight: 600;">Campos principales</span>
        </div>

        <form th:action="@{/mascotas/guardar}" th:object="${mascota}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="grid">
                <div class="field half">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre}" placeholder="Ej. Luna">
                </div>

                <div class="field half">
                    <label>Especie</label>
                    <input type="text" th:field="*{especie}" placeholder="Ej. Perro">
                </div>

                <div class="field half">
                    <label>Raza</label>
                    <input type="text" th:field="*{raza}" placeholder="Ej. Golden Retriever">
                </div>

                <div class="field half">
                    <label>Edad</label>
                    <input type="number" th:field="*{edad}" placeholder="Ej. 3">
                </div>

                <div class="field">
                    <label>Cliente</label>
                    <select th:field="*{cliente.id}">
                        <option value="">Selecciona un cliente</option>
                        <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.razonSocial}"></option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <a href="/mascotas" class="btn btn-secondary">Volver</a>
                <button type="submit" class="btn btn-primary">Guardar mascota</button>
            </div>
        </form>
    </section>
</div>

</body>
</html>
