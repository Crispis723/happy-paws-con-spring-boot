<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro clínico - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.min.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">

<div th:replace="~{partials/session-guard :: guard}"></div>

</head>
<body>
    <div th:insert="~{partials/header :: header}"></div>
    <div class="page-shell">
        <div class="hero-panel d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
            <div>
                <span class="hero-kicker mb-2"><i class="bi bi-journal-plus"></i> Historial clínico</span>
                <h1 class="display-6 fw-bold mb-2">Registro para <span th:text="${mascota.nombre}">mascota</span></h1>
                <p class="mb-0 opacity-75">Guarda evolución médica, diagnósticos y archivos de soporte con vigencia anual.</p>
            </div>
            <a th:href="@{/historial/mascota/{petId}(petId=${mascota.id})}" class="btn btn-outline-light btn-lg rounded-pill fw-semibold px-4"><i class="bi bi-arrow-left me-1"></i> Regresar</a>
        </div>

        <div class="surface-card p-4 p-md-5">
            <form th:action="@{/historial/mascota/{petId}/guardar(petId=${mascota.id})}" th:object="${historial}" method="post" enctype="multipart/form-data" class="row g-4">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{archivoGuardado}">
                <input type="hidden" th:field="*{archivoOriginal}">
                <input type="hidden" th:field="*{archivoTipo}">
                <input type="hidden" th:field="*{archivoTamanio}">

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Fecha de registro</label>
                    <input type="date" class="form-control form-control-lg" th:field="*{fechaRegistro}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Cita relacionada</label>
                    <select class="form-select form-select-lg" th:field="*{cita.id}">
                        <option value="">-- Sin cita relacionada --</option>
                        <option th:each="cita : ${citasMascota}" th:value="${cita.id}" th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm') + ' - ' + cita.motivo}">Cita</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Título</label>
                    <input type="text" class="form-control form-control-lg" th:field="*{titulo}" maxlength="150" placeholder="Ej. Control postoperatorio">
                    <div class="text-danger" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
                </div>

                <h5 class="col-12 mb-0 mt-2"><i class="bi bi-heart-pulse me-1"></i> Signos vitales y examen</h5>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Peso (kg)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{peso}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Temperatura (°C)</label>
                    <input type="number" step="0.1" class="form-control" th:field="*{temperatura}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Frec. cardíaca (lpm)</label>
                    <input type="number" class="form-control" th:field="*{frecuenciaCardiaca}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Frec. respiratoria (rpm)</label>
                    <input type="number" class="form-control" th:field="*{frecuenciaRespiratoria}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Condición corporal (1-9)</label>
                    <input type="number" min="1" max="9" class="form-control" th:field="*{condicionCorporal}">
                </div>
                <div class="col-md-8">
                    <label class="form-label fw-semibold">Motivo de consulta</label>
                    <input type="text" class="form-control" th:field="*{motivoConsulta}" maxlength="255">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Anamnesis</label>
                    <textarea class="form-control" rows="3" th:field="*{anamnesis}" maxlength="1000" placeholder="Historia relatada por el propietario"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Examen físico</label>
                    <textarea class="form-control" rows="3" th:field="*{examenFisico}" maxlength="1000" placeholder="Hallazgos del examen físico"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Detalle clínico</label>
                    <textarea class="form-control" rows="4" th:field="*{detalle}" maxlength="1500" placeholder="Evolución, observaciones y procedimientos realizados"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Diagnóstico</label>
                    <textarea class="form-control" rows="3" th:field="*{diagnostico}" maxlength="500"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Tratamiento</label>
                    <textarea class="form-control" rows="3" th:field="*{tratamiento}" maxlength="500"></textarea>
                </div>

                <h5 class="col-12 mb-0 mt-2"><i class="bi bi-capsule me-1"></i> Medicación indicada</h5>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Medicamento</label>
                    <input type="text" class="form-control" th:field="*{medicamento}" maxlength="255">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Dosis</label>
                    <input type="text" class="form-control" th:field="*{dosis}" maxlength="100" placeholder="Ej. 5mg/kg">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Frecuencia</label>
                    <input type="text" class="form-control" th:field="*{frecuenciaMedicamento}" maxlength="100" placeholder="Ej. Cada 12h">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Duración</label>
                    <input type="text" class="form-control" th:field="*{duracionTratamiento}" maxlength="100" placeholder="Ej. 7 días">
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Próximo control</label>
                    <input type="date" class="form-control" th:field="*{proximoControl}">
                </div>
                <div class="col-md-8">
                    <label class="form-label fw-semibold">Recomendaciones</label>
                    <textarea class="form-control" rows="2" th:field="*{recomendaciones}" maxlength="1000"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Observaciones</label>
                    <textarea class="form-control" rows="2" th:field="*{observaciones}" maxlength="1000"></textarea>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold">Adjunto clínico (radiografía, examen, receta)</label>
                    <input type="file" class="form-control" name="archivo" accept=".jpg,.jpeg,.png,.pdf,.doc,.docx">
                    <div class="form-text">El archivo quedará vigente por 1 año desde la fecha del registro.</div>
                    <div class="form-text" th:if="${historial.archivoOriginal != null}">Archivo actual: <span class="fw-semibold" th:text="${historial.archivoOriginal}">archivo</span></div>
                </div>
                <div class="col-12 d-flex justify-content-end gap-2">
                    <a th:href="@{/historial/mascota/{petId}(petId=${mascota.id})}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar historial</button>
                </div>
            </form>
        </div>
    </div>
    <div th:insert="~{partials/footer :: footer}"></div>
</body>
</html>
