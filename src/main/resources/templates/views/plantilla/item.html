<div xmlns:th="http://www.thymeleaf.org" th:fragment="item(title, description)">
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header d-flex align-items-center">
            <h3 class="card-title flex-grow-1 mb-0" th:text="${title}">Listado</h3>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalUpdate">
                <i class="bi bi-plus-circle"></i> Nuevo
            </button>
        </div>
        <div class="card-body">
            <p class="text-muted mb-3" th:text="${description}">Descripción del módulo</p>
            <div class="table-responsive">
                <table class="table table-striped table-hover table-sm align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Acción</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                            <td>NIU</td>
                            <td>Unidades</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
