<div xmlns:th="http://www.thymeleaf.org" th:fragment="actionModal">
    <div class="modal fade" id="modalUpdate" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <form id="formUpdate" method="post">
                    <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">
                    <input type="hidden" id="method_field" name="_method">
                    <div class="modal-header bg-primary text-white">
                        <h4 class="modal-title fs-5" id="modalTitle">Nuevo rol</h4>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="name" class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                                <input type="text" id="name" name="name" class="form-control" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Permisos</label>
                                <div id="checkbox-permisos" class="row g-2">
                                    <div class="col-md-6 col-lg-4" th:each="permiso : ${permisos}">
                                        <div class="form-check border rounded-3 p-2 h-100">
                                            <input class="form-check-input" type="checkbox" th:id="${'permiso-' + permiso.id}" name="permissions" th:value="${permiso.id}">
                                            <label class="form-check-label" th:for="${'permiso-' + permiso.id}" th:text="${permiso.name}">Permiso</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="invalid-feedback d-block" id="permissions-error"></div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="btnSubmit" class="btn btn-primary">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
