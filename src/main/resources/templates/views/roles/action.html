<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${role.id == null ? 'Nuevo rol' : 'Editar rol'} + ' - Happy Paws'">Rol</title><link rel="stylesheet" th:href="@{/css/adminlte.css}"><link rel="stylesheet" th:href="@{/css/happypaws-ui.css}"><link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
<div th:replace="~{partials/session-guard :: guard}"></div>

</head><body><div th:insert="~{partials/header :: header}"></div><div class="page-shell"><div class="hero-panel d-flex justify-content-between gap-3"><div><span class="hero-kicker"><i class="bi bi-shield-lock"></i> Seguridad</span><h1 class="display-6 fw-bold" th:text="${role.id == null ? 'Nuevo rol' : 'Editar rol'}">Nuevo rol</h1><p class="mb-0 opacity-75">Define el perfil y los permisos que tendrá.</p></div><a th:href="@{/roles}" class="btn btn-light rounded-pill">Volver</a></div><div class="surface-card p-4 p-md-5 mt-4"><form th:action="@{/roles/guardar}" th:object="${role}" method="post"><input type="hidden" th:field="*{id}"><div class="row g-3"><div class="col-md-6"><label class="form-label fw-semibold">Nombre</label><input class="form-control" th:field="*{name}" required maxlength="50"><div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div></div><div class="col-md-6"><label class="form-label fw-semibold">Descripción</label><input class="form-control" th:field="*{description}" maxlength="150"></div></div><hr class="my-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><h4 class="mb-1">Permisos del rol</h4><small class="text-muted">Selecciona exactamente las operaciones permitidas.</small></div><div class="form-check"><input class="form-check-input" type="checkbox" id="selectAll"><label class="form-check-label" for="selectAll">Seleccionar todos</label></div></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Módulo</th><th>Permiso</th><th>Acción</th><th class="text-center">Asignado</th></tr></thead><tbody><tr th:each="permission : ${permissions}"><td th:text="${permission.module.name}">Módulo</td><td><strong th:text="${permission.code}">CODE</strong><div class="small text-muted" th:text="${permission.description}">Descripción</div></td><td><span class="badge text-bg-light" th:text="${permission.action}">VIEW</span></td><td class="text-center"><input class="form-check-input permission-check" type="checkbox" name="permissionIds" th:value="${permission.id}" th:checked="${selectedPermissionIds.contains(permission.id)}"></td></tr></tbody></table></div><div class="d-flex justify-content-end gap-2 mt-4"><a th:href="@{/roles}" class="btn btn-outline-secondary">Cancelar</a><button class="btn btn-primary px-4" type="submit"><i class="bi bi-save me-1"></i> Guardar rol y permisos</button></div></form></div></div><div th:insert="~{partials/footer :: footer}"></div><script>const all=document.getElementById('selectAll');all?.addEventListener('change',()=>document.querySelectorAll('.permission-check').forEach(x=>x.checked=all.checked));</script></body></html>
