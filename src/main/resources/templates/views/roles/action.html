<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${role.id == null ? 'Nuevo rol' : 'Editar rol'} + ' - Happy Paws'">Rol - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="page-shell">
        <div class="hero-panel d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
            <div>
                <span class="hero-kicker mb-2"><i class="bi bi-shield-plus"></i> Roles</span>
                <h1 class="display-6 fw-bold mb-2" th:text="${role.id == null ? 'Nuevo rol' : 'Editar rol'}">Nuevo rol</h1>
                <p class="mb-0 opacity-75">Define un nombre claro para el perfil de acceso.</p>
            </div>
            <a th:href="@{/roles}" class="btn btn-light btn-lg rounded-pill fw-semibold text-info px-4"><i class="bi bi-arrow-left me-1"></i> Volver</a>
        </div>

        <div class="surface-card p-4 p-md-5">
            <form th:action="@{/roles/guardar}" th:object="${role}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">
                <div class="col-md-8">
                    <label class="form-label fw-semibold">Nombre del rol</label>
                    <input class="form-control form-control-lg" th:field="*{name}" placeholder="ADMIN, VETERINARIO, RECEPCIONISTA, CLIENTE">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <div class="w-100 p-3 rounded-4 bg-light border theme-outline">
                        <div class="text-muted small text-uppercase">Consejo</div>
                        <div class="fw-semibold">Mantén nombres cortos y consistentes con el sistema.</div>
                    </div>
                </div>
                <div class="col-12 d-flex justify-content-end gap-2 pt-2">
                    <a th:href="@{/roles}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4">Guardar rol</button>
                </div>
            </form>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
