<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roles - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="page-shell">
        <div class="hero-panel d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
            <div>
                <span class="hero-kicker mb-2"><i class="bi bi-shield-lock"></i> Seguridad</span>
                <h1 class="display-6 fw-bold mb-2">Roles</h1>
                <p class="mb-0 opacity-75">Administra los perfiles de acceso y separa visualmente cada perfil del sistema.</p>
            </div>
            <a th:href="@{/roles/nuevo}" class="btn btn-light btn-lg rounded-pill fw-semibold text-info px-4"><i class="bi bi-plus-circle me-1"></i> Nuevo rol</a>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-6 col-lg-3" th:each="roleView : ${roleViews}">
                <div class="role-card p-4 h-100">
                    <div class="d-flex align-items-start justify-content-between mb-3">
                        <span class="role-card__icon" th:style="${'background:' + roleView.color}">
                            <i class="bi" th:classappend="${roleView.icon}"></i>
                        </span>
                        <span class="role-badge" th:classappend="${roleView.badgeClass}" th:text="${roleView.name}">ADMIN</span>
                    </div>
                    <h3 class="h5 fw-bold mb-2" th:text="${roleView.scope}">Administración completa</h3>
                    <p class="text-muted mb-0" th:text="${roleView.description}">Descripción</p>
                </div>
            </div>
        </div>

        <div class="surface-card">
            <div class="card-header d-flex align-items-center gap-2">
                <h5 class="card-title flex-grow-1 mb-0 text-primary fw-bold"><i class="bi bi-list-check me-1"></i> Catálogo de roles</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table app-table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Perfil</th>
                                <th>Nombre</th>
                                <th>Estado</th>
                                <th style="width: 18%;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${roles == null or #lists.isEmpty(roles)}">
                                <td colspan="4" class="text-center text-muted py-5">No hay roles registrados.</td>
                            </tr>
                            <tr th:each="rol : ${roles}">
                                <td>
                                    <span class="role-badge" th:classappend="${rol.name == 'ADMIN' ? 'role-badge--danger' : (rol.name == 'VETERINARIO' ? 'role-badge--primary' : (rol.name == 'RECEPCIONISTA' ? 'role-badge--success' : (rol.name == 'CLIENTE' ? 'role-badge--info' : 'role-badge--neutral'))) }" th:text="${rol.name}">ROL</span>
                                </td>
                                <td class="fw-semibold" th:text="${rol.name}">--</td>
                                <td><span class="stat-pill"><i class="bi bi-check-circle-fill"></i> Activo</span></td>
                                <td class="text-center">
                                    <a th:href="@{/roles/edit/{id}(id=${rol.id})}" class="btn btn-sm btn-outline-warning" title="Editar"><i class="bi bi-pencil"></i></a>
                                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="if(confirm('¿Está seguro?')) window.location.href=this.dataset.url;" th:data-url="@{/roles/delete/{id}(id=${rol.id})}" title="Eliminar"><i class="bi bi-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
