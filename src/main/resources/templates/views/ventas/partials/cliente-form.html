<div class="row g-3">
        <div class="col-md-12">
            <nav>
                <div class="nav nav-tabs border-0 mb-3" id="nav-tab" role="tablist">
                    <button class="nav-link active fw-semibold" id="nav-buscar-tab" data-bs-toggle="tab"
                        data-bs-target="#nav-buscar" type="button" role="tab" aria-controls="nav-buscar"
                        aria-selected="true">Buscar Cliente</button>
                    <button class="nav-link fw-semibold" id="nav-registra-tab" data-bs-toggle="tab" data-bs-target="#nav-registrar"
                        type="button" role="tab" aria-controls="nav-registrar" aria-selected="false">Registrar
                        Cliente</button>
                </div>
            </nav>
            <div class="tab-content" id="nav-tabContent">
                <div class="tab-pane fade show active" id="nav-buscar" role="tabpanel" aria-labelledby="nav-buscar-tab">
                    <div class="row mt-2 g-3">
                        <div class="col-md-12">
                            <label for="cliente_razon_social" class="form-label fw-semibold">Cliente</label>
                            <input type="text" id="cliente_razon_social" class="form-control"
                                autocomplete="off" placeholder="Buscar cliente..." data-error-field="cliente_id">
                            <div class="invalid-feedback"></div>
                            <input type="hidden" id="cliente_id" name="cliente_id">
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="nav-registrar" role="tabpanel" aria-labelledby="nav-registra-tab">
                    <div class="row mt-2 g-3">
                        <div class="col-md-6">
                            <label for="documento_tipo_codigo" class="form-label fw-semibold">Documento tipo</label>
                            <select name="documento_tipo_codigo" id="documento_tipo_codigo"
                                class="form-select">

                            </select>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="numero_documento" class="form-label fw-semibold">Número documento</label>
                            <input type="text" class="form-control" id="numero_documento"
                                name="numero_documento">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="razon_social" class="form-label fw-semibold">Razón social</label>
                            <input type="text" class="form-control" id="razon_social"
                                name="razon_social">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-6 d-flex align-items-end justify-content-end">
                            <button type="button" class="btn btn-primary" id="btnRegistrarCliente">Guardar cliente</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
</div>
