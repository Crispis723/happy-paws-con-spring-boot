<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar venta - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="container-fluid p-4">
        <div class="card">
            <div class="card-header"><h3 class="card-title mb-0">Formulario de venta</h3></div>
            <div class="card-body">
                <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post" class="row g-3">
                    <input type="hidden" th:field="*{id}">
                    <div class="col-md-6"><label class="form-label">Número</label><input class="form-control" th:field="*{numero}" readonly></div>
                    <div class="col-md-6"><label class="form-label">Fecha</label><input type="date" class="form-control" th:field="*{fecha}"></div>
                    <div class="col-md-6">
                        <label class="form-label">Cliente</label>
                        <select class="form-select" th:field="*{cliente.id}">
                            <option value="">-- Seleccionar --</option>
                            <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.razonSocial}"></option>
                        </select>
                    </div>
                    <div class="col-md-6"><label class="form-label">Forma de pago</label><select class="form-select" th:field="*{formaPago}"><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option><option value="transferencia">Transferencia</option></select></div>
                    <div class="col-md-6"><label class="form-label">Estado</label><select class="form-select" th:field="*{estado}"><option value="registrada">Registrada</option><option value="anulada">Anulada</option></select></div>
                    <div class="col-md-6"><label class="form-label">Total</label><input type="number" class="form-control" step="0.01" min="0" th:field="*{total}"></div>
                    <div class="col-12 d-flex justify-content-between gap-2">
                        <a th:href="@{/ventas}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar venta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
