<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${venta.idVenta == null ? 'Registrar venta - Happy Paws' : 'Editar venta - Happy Paws'}">Registrar venta - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
    <style>
        body { min-height: 100vh; background: linear-gradient(180deg, #f8fdfd 0%, #eef8f7 100%); }
        .page-shell { max-width: 1180px; margin: 0 auto; padding: 2rem 1rem 3rem; }
        .hero-panel { background: linear-gradient(135deg, #8adfd7 0%, #58b8c7 100%); color: white; border-radius: 28px; padding: 2rem; box-shadow: 0 22px 50px rgba(71, 150, 164, 0.12); margin-bottom: 1.5rem; }
        .surface-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border: 1px solid rgba(138, 223, 215, 0.22); border-radius: 24px; box-shadow: 0 16px 36px rgba(71, 150, 164, 0.08); overflow: hidden; }
    </style>

<div th:replace="~{partials/session-guard :: guard}"></div>

</head>
<body>
    <div th:insert="~{partials/header :: header}"></div>
    <div class="page-shell">
        <div class="hero-panel d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
            <div>
                <span class="hero-kicker mb-2 d-inline-flex align-items-center gap-1"><i class="bi bi-cash-coin"></i> Ventas</span>
                <h1 class="display-6 fw-bold mb-2" th:text="${venta.idVenta == null ? 'Registrar venta' : 'Editar venta'}">Registrar venta</h1>
                <p class="mb-0 opacity-75">Agrega los productos que se están vendiendo y el total se calcula automáticamente.</p>
            </div>
            <a th:href="@{/ventas}" class="btn btn-light btn-lg rounded-pill fw-semibold text-info px-4"><i class="bi bi-arrow-left me-1"></i> Volver</a>
        </div>

        <div class="surface-card">
            <div class="card-header bg-white border-bottom-0 py-3">
                <h5 class="mb-0 text-primary fw-bold"><i class="bi bi-cart-check me-1"></i> Datos de la venta</h5>
            </div>
            <div class="card-body p-4 p-md-5">
                <form id="formVenta" th:action="@{/ventas/guardar}" th:object="${venta}" method="post" novalidate class="row g-4">
                    <input type="hidden" th:field="*{id}">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Número</label>
                        <input class="form-control form-control-lg" th:field="*{numero}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Fecha <span class="text-danger">*</span></label>
                        <input type="date" class="form-control form-control-lg" th:field="*{fecha}">
                    </div>
                    <div class="col-md-6" th:if="${isClientUser == null or !isClientUser}">
                        <label class="form-label fw-semibold">Cliente <span class="text-danger">*</span></label>
                        <select class="form-select form-select-lg" th:field="*{cliente.id}">
                            <option value="">-- Seleccionar --</option>
                            <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.razonSocial}"></option>
                        </select>
                    </div>
                    <div class="col-md-6" th:if="${isClientUser}">
                        <label class="form-label fw-semibold">Cliente</label>
                        <input type="text" class="form-control form-control-lg" th:value="${clienteNombre}" readonly>
                        <input type="hidden" th:field="*{cliente.id}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Forma de pago</label>
                        <select class="form-select form-select-lg" th:field="*{formaPago}">
                            <option value="efectivo">Efectivo</option>
                            <option value="tarjeta">Tarjeta</option>
                            <option value="transferencia">Transferencia</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Estado</label>
                        <select class="form-select form-select-lg" th:field="*{estado}">
                            <option value="registrada">Registrada</option>
                            <option value="anulada">Anulada</option>
                        </select>
                    </div>

                    <div th:replace="~{views/ventas/partials/detalle-productos :: detalleProductos}"></div>

                    <div class="col-12 d-flex flex-column flex-sm-row justify-content-between gap-2 pt-2">
                        <a th:href="@{/ventas}" class="btn btn-outline-secondary btn-lg px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary btn-lg px-4" th:text="${venta.idVenta == null ? 'Guardar venta' : 'Actualizar venta'}">Guardar venta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:insert="~{partials/footer :: footer}"></div>
</body>
</html>
