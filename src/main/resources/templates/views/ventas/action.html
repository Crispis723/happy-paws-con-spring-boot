<div xmlns:th="http://www.thymeleaf.org" th:fragment="actionModal">
    <div class="modal fade" id="modalUpdate" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <form id="formUpdate" method="post">
                    <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">
                    <input type="hidden" id="method_field" name="_method">
                    <div class="modal-header text-white" style="background: linear-gradient(135deg, #8adfd7 0%, #58b8c7 100%);">
                        <div>
                            <p class="text-uppercase small fw-semibold mb-1 opacity-75">Ventas</p>
                            <h4 class="modal-title fs-5 mb-0" id="modalTitle">Nueva venta</h4>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4 p-md-5">
                        <div class="row g-4">
                            <div class="col-lg-6">
                                <div class="card border-0 shadow-sm rounded-4 h-100">
                                    <div class="card-body p-3 p-md-4">
                                        <h6 class="fw-bold text-primary mb-3">Comprobante</h6>
                                        <div class="row g-3">
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold">Tipo comprobante</label>
                                                <input type="text" name="comprobante_tipo_codigo" class="form-control" placeholder="01">
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold">Serie</label>
                                                <input type="text" name="serie" class="form-control" placeholder="F001">
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold">Correlativo</label>
                                                <input type="number" name="correlativo" class="form-control" min="1">
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold">Fecha</label>
                                                <input type="date" name="fecha" class="form-control">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="card border-0 shadow-sm rounded-4 h-100">
                                    <div class="card-body p-3 p-md-4">
                                        <h6 class="fw-bold text-primary mb-3">Cliente</h6>
                                        <div class="row g-3">
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold">Documento tipo</label>
                                                <input type="text" name="documento_tipo_codigo" class="form-control" placeholder="01">
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold">Número documento</label>
                                                <input type="text" name="numero_documento" class="form-control">
                                            </div>
                                            <div class="col-12">
                                                <label class="form-label fw-semibold">Razón social</label>
                                                <input type="text" name="razon_social" class="form-control">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="border rounded-4 p-4" style="border-color: rgba(138, 223, 215, 0.35) !important; background: #f8fefe;">
                                    <label class="form-label fw-semibold mb-2">Agregar producto</label>
                                    <div class="input-group input-group-lg">
                                        <input type="text" id="producto_nombre" class="form-control" placeholder="Buscar producto" autocomplete="off">
                                        <input type="hidden" id="producto_id" name="producto_id">
                                        <button type="button" id="btnAgregarProducto" class="btn btn-primary">Agregar</button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="card border-0 shadow-sm rounded-4">
                                    <div class="card-body p-3 p-md-4">
                                        <h6 class="fw-bold text-primary mb-3">Detalle de venta</h6>
                                        <div class="table-responsive">
                                            <table class="table table-sm align-middle mb-0">
                                                <thead>
                                                    <tr>
                                                        <th>Producto</th>
                                                        <th class="text-center">Cant.</th>
                                                        <th class="text-end">P. Unit.</th>
                                                        <th class="text-end">Total</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr>
                                                        <td colspan="4" class="text-center text-muted py-4">Los detalles se cargarán aquí.</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 px-4 px-md-5 pb-4 pb-md-5">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="btnSubmit" class="btn btn-primary">Guardar venta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
