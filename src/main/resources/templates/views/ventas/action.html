<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar venta - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <div class="page-shell">
        <div class="hero-panel d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
            <div>
                <span class="hero-kicker mb-2"><i class="bi bi-cash-coin"></i> Ventas</span>
                <h1 class="display-6 fw-bold mb-2">Registrar venta</h1>
                
                <p class="mb-0 opacity-75">Crea una venta simple con una interfaz limpia y consistente.</p>
            </div>
            <a th:href="@{/ventas}" class="btn btn-light btn-lg rounded-pill fw-semibold text-info px-4"><i class="bi bi-arrow-left me-1"></i> Volver</a>
        </div>

        <div class="surface-card p-4 p-md-5">
            <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post" class="row g-4">
                <input type="hidden" th:field="*{id}">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Número</label>
                    <input class="form-control form-control-lg" th:field="*{numero}" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Fecha</label>
                    <input type="date" class="form-control form-control-lg" th:field="*{fecha}">
                </div>
                <div class="col-md-6" th:if="${isClientUser == null or !isClientUser}">
                    <label class="form-label fw-semibold">Cliente</label>
                    <select class="form-select form-select-lg" th:field="*{cliente.id}">
                        <option value="">-- Seleccionar --</option>
                        <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.razonSocial}"></option>
                    </select>
                </div>
                <div class="col-md-6" th:if="${isClientUser}">
                    <label class="form-label fw-semibold">Cliente</label>
                    <input type="text" class="form-control form-control-lg" th:value="${clienteNombre}" readonly>
                    <input type="hidden" th:field="*{cliente.id}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Forma de pago</label>
                    <select class="form-select form-select-lg" th:field="*{formaPago}"><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option><option value="transferencia">Transferencia</option></select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Estado</label>
                    <select class="form-select form-select-lg" th:field="*{estado}"><option value="registrada">Registrada</option><option value="anulada">Anulada</option></select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Total</label>
                    <input type="number" class="form-control form-control-lg" step="0.01" min="0" th:field="*{total}">
                </div>
                <div class="col-12 d-flex justify-content-end gap-2 pt-2">
                    <a th:href="@{/ventas}" class="btn btn-outline-secondary btn-lg px-4">Cancelar</a>
                    <button type="submit" class="btn btn-primary btn-lg px-4">Guardar venta</button>
                </div>
            </form>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
