<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de venta</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 11px; margin: 0; padding: 0; background: #fff; color: #111; }
        .ticket { width: 280px; margin: 0 auto; padding: 16px 14px; }
        .center { text-align: center; }
        .bold { font-weight: 700; }
        .line { border-top: 1px dashed #000; margin: 8px 0; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 2px 0; vertical-align: top; }
        .totales td { padding: 3px 0; }
    </style>
</head>
<body>
    <div class="ticket">
        <div class="center">
            <h3 class="bold" th:text="${empresa.razon_social}">Happy Paws</h3>
            <p th:text="${empresa.direccion}">Dirección</p>
            <p th:text="'RUC: ' + ${empresa.ruc}">RUC</p>
            <p class="bold" th:text="${venta.comprobante_tipo_codigo == '01' ? 'FACTURA ELECTRÓNICA' : 'BOLETA ELECTRÓNICA'}">FACTURA ELECTRÓNICA</p>
            <p class="bold" th:text="${venta.serie} + '-' + ${#strings.leftPad(venta.correlativo, 8, '0')}">F001-00000001</p>
        </div>
        <div class="line"></div>
        <p><strong>Cliente:</strong> <span th:text="${venta.cliente != null ? venta.cliente.razon_social : '-'}">-</span></p>
        <p><strong>Documento:</strong> <span th:text="${venta.cliente != null and venta.cliente.documentoTipo != null ? venta.cliente.documentoTipo.descripcion : '-'}">-</span> <span th:text="${venta.cliente != null ? venta.cliente.numero_documento : '-'}">-</span></p>
        <p><strong>Dirección:</strong> <span th:text="${venta.cliente != null ? venta.cliente.direccion : '-'}">-</span></p>
        <p><strong>Fecha:</strong> <span th:text="${venta.created_at}">-</span></p>
        <div class="line"></div>
        <table>
            <tr class="bold">
                <td style="width: 45%;">Descripción</td>
                <td style="width: 15%; text-align: center;">Cant.</td>
                <td style="width: 20%; text-align: right;">P. Unit.</td>
                <td style="width: 20%; text-align: right;">Total</td>
            </tr>
            <tr><td colspan="4" style="border-top: 1px solid #000; padding: 1px 0;"></td></tr>
            <tr th:each="detalle : ${venta.detalles}">
                <td th:text="${detalle.producto != null ? detalle.producto.nombre : '-'}">Producto</td>
                <td style="text-align: center;" th:text="${detalle.cantidad}">1</td>
                <td style="text-align: right;" th:text="${#numbers.formatDecimal(detalle.precio_unitario, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                <td style="text-align: right;" th:text="${#numbers.formatDecimal(detalle.total, 1, 'COMMA', 2, 'POINT')}">0.00</td>
            </tr>
            <tr><td colspan="4" style="border-top: 1px solid #000; padding: 1px 0;"></td></tr>
        </table>
        <table class="totales">
            <tr><td>OP. GRAVADAS:</td><td style="text-align: right;" th:text="'S/ ' + ${#numbers.formatDecimal(venta.op_gravada, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td></tr>
            <tr><td>OP. EXONERADAS:</td><td style="text-align: right;" th:text="'S/ ' + ${#numbers.formatDecimal(venta.op_exonerada, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td></tr>
            <tr><td>OP. INAFECTAS:</td><td style="text-align: right;" th:text="'S/ ' + ${#numbers.formatDecimal(venta.op_inafecta, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td></tr>
            <tr><td>Impuesto (18%):</td><td style="text-align: right;" th:text="'S/ ' + ${#numbers.formatDecimal(venta.impuesto, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td></tr>
            <tr class="bold"><td>TOTAL:</td><td style="text-align: right;" th:text="'S/ ' + ${#numbers.formatDecimal(venta.total, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td></tr>
        </table>
        <div class="line"></div>
        <div class="center">
            <p>¡Gracias por su compra!</p>
        </div>
    </div>
</body>
</html>
