<nav th:fragment="header" class="app-header navbar navbar-expand" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" style="background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);">
    <link rel="stylesheet" th:href="@{/css/happypaws-ui.css}" />
    <div class="container-fluid">
        <ul class="navbar-nav">
            <li class="nav-item">
                <button class="nav-link text-white btn btn-link p-0" data-lte-toggle="sidebar" type="button" aria-label="Abrir o cerrar barra lateral">
                    <i class="bi bi-list"></i>
                </button>
            </li>
            <li class="nav-item ms-2" th:if="${currentPath != '/dashboard' and currentPath != '/dashboard/cliente' and currentPath != '/dashboard/colaboradores'}">
                <a sec:authorize="hasAnyRole('ADMIN','VETERINARIO','RECEPCIONISTA')"
                   class="btn btn-outline-light btn-sm rounded-pill px-3 d-inline-flex align-items-center gap-1"
                   th:href="@{/dashboard}" title="Regresar al dashboard" aria-label="Regresar al dashboard">
                    <i class="bi bi-arrow-left"></i>
                    <span>Regresar</span>
                </a>
                <a sec:authorize="hasRole('CLIENTE') and !hasAnyRole('ADMIN','VETERINARIO','RECEPCIONISTA')"
                   class="btn btn-outline-light btn-sm rounded-pill px-3 d-inline-flex align-items-center gap-1"
                   th:href="@{/dashboard/cliente}" title="Regresar al dashboard" aria-label="Regresar al dashboard">
                    <i class="bi bi-arrow-left"></i>
                    <span>Regresar</span>
                </a>
            </li>
            <li class="nav-item" th:if="${currentPath == '/dashboard' or currentPath == '/dashboard/cliente' or currentPath == '/dashboard/colaboradores'}">
                <button class="nav-link text-white btn btn-link p-0" type="button" title="Cerrar sesión" onclick="document.getElementById('logout-form').submit();">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </li>
            <li class="nav-item d-none d-md-block"><a th:href="@{/citas/create}" class="nav-link text-white">Pedir cita</a></li>
            <li class="nav-item d-none d-md-block" sec:authorize="hasAnyRole('ADMIN','VETERINARIO','RECEPCIONISTA')"><a th:href="@{/mascotas}" class="nav-link text-white">Pacientes</a></li>
        </ul>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <button class="nav-link btn btn-link p-0" type="button" data-lte-toggle="fullscreen" aria-label="Pantalla completa">
                    <i data-lte-icon="maximize" class="bi bi-arrows-fullscreen"></i>
                    <i data-lte-icon="minimize" class="bi bi-fullscreen-exit" style="display: none"></i>
                </button>
            </li>
            <li class="nav-item dropdown user-menu" sec:authorize="isAuthenticated()">
                <button type="button" class="nav-link dropdown-toggle text-white btn btn-link p-0" data-bs-toggle="dropdown">
                    <span class="d-none d-md-inline" sec:authentication="name">Usuario</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
                    <li class="user-header" style="background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%); color: white;">
                        <p sec:authentication="name">Nombre</p>
                    </li>
                    <li class="user-footer">
                        <a th:href="@{/perfil}" class="btn btn-default btn-flat">Perfil</a>
                        <button type="button" onclick="document.getElementById('logout-form').submit();" class="btn btn-default btn-flat float-end">Cerrar Sesión</button>
                    </li>
                    <form id="logout-form" th:action="@{/logout}" method="post" class="d-none">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    </form>
                </ul>
            </li>
        </ul>
    </div>
</nav>


<script sec:authorize="isAuthenticated()">
<!-- La validación temprana de pestaña está en <head>. No invalidamos la sesión aquí:
     JSESSIONID es compartido por las pestañas y hacerlo cerraría la sesión original. -->
</script>
