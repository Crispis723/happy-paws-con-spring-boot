<!doctype html>
<html lang="en">
  <!--begin::Head-->
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title th:text="${pageTitle ?: 'Sistema - Compubinsas'}">Sistema - Compubinsas</title>
    <!--begin::Primary Meta Tags-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Sistema - Compubinsas" />
    <meta name="author" content="Compubinsas" />
    <meta
      name="description"
      content="Sistema de Ventas en Laravell."
    />
    <meta
      name="keywords"
      content="Sistema en laravel, Sistema de Ventas"
    />
    <meta name="csrf-token" th:content="${_csrf.token}" />
    <!--end::Primary Meta Tags-->
    
    <!-- App CSS/JS bundles (if using a build tool, include here) -->
    <link rel="shortcut icon" th:href="@{/assets/favicon_1.ico}" type="image/x-icon">
    <!--begin::Fonts-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
      integrity="sha256-tXJfXfp6Ewt1ilPzLDtQnJV4hclT9XuaZUKyUvmyr+Q="
      crossorigin="anonymous"
    />
    <!--end::Fonts-->
    <!--begin::Third Party Plugin(OverlayScrollbars)-->
    <link rel="stylesheet" th:href="@{/css/overlayscrollbars.min.css}" />
    <!--end::Third Party Plugin(OverlayScrollbars)-->
    <!--begin::Third Party Plugin(Bootstrap Icons)-->
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}" />
    <!--end::Third Party Plugin(Bootstrap Icons)-->
    <!--begin::Global Colors CSS-->
    <link rel="stylesheet" th:href="@{/css/colors.css}" />
    <!--end::Global Colors CSS-->
    <!--begin::Required Plugin(AdminLTE)-->
    <link rel="stylesheet" th:href="@{/css/adminlte.css}" />
    <!--end::Required Plugin(AdminLTE)-->
    <link rel="stylesheet" th:href="@{/datatables/dataTables.bootstrap5.css}" />
    <!-- Styles placeholder -->
    <th:block th:replace="${styles}"></th:block>
  </head>
  <!--end::Head-->
  <!--begin::Body-->
  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <!--begin::App Wrapper-->
    <div class="app-wrapper">
      <!--begin::Header-->
      <div th:insert="views/plantilla/header :: header"></div>
      <!--end::Header-->
      <!--begin::Sidebar-->
      <div th:insert="views/plantilla/menu :: menu"></div>
      <!--end::Sidebar-->
      <!--begin::App Main-->
      <main class="app-main">
        <!--begin::App Content Header-->
        <div class="app-content-header">
          <!--begin::Container-->
          <div class="container-fluid">
          </div>
          <!--end::Container-->
        </div>
        <!--end::App Content Header-->
        <!--begin::App Content-->
        <div class="app-content">
          <!--begin::Container-->
          <div th:fragment="content"><!-- Page content will be inserted here with Thymeleaf --></div>
          <!--end::Container-->
        </div>
        <!--end::App Content-->
      </main>
      <!--end::App Main-->
      <!--begin::Footer-->
      <div th:insert="views/plantilla/footer :: footer"></div>
      <!--end::Footer-->
    </div>
    <!--end::App Wrapper-->
    <!--begin::Script-->
    <!--begin::Third Party Plugin(OverlayScrollbars)-->
    <script th:src="@{/js/overlayscrollbars.browser.es6.min.js}"></script>
    <!--end::Third Party Plugin(OverlayScrollbars)--><!--begin::Required Plugin(popperjs for Bootstrap 5)-->
    <script th:src="@{/js/popper.min.js}"></script>
    <!--end::Required Plugin(popperjs for Bootstrap 5)--><!--begin::Required Plugin(Bootstrap 5)-->
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <!--end::Required Plugin(Bootstrap 5)--><!--begin::Required Plugin(AdminLTE)-->
    <script th:src="@{/js/adminlte.js}"></script>
    <script th:src="@{/datatables/jquery-3.7.1.js}"></script>
    <script th:src="@{/datatables/dataTables.js}"></script>
    <script th:src="@{/datatables/dataTables.bootstrap5.js}"></script>
    <script th:src="@{/js/sweetalert2.js}"></script>
    <script th:src="@{/js/crud.js}"></script>
    <!-- Scripts placeholder -->
    <th:block th:replace="${scripts}"></th:block>
    <!--end::Required Plugin(AdminLTE)--><!--begin::OverlayScrollbars Configure-->
    <script>
      const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
      const Default = {
        scrollbarTheme: 'os-theme-light',
        scrollbarAutoHide: 'leave',
        scrollbarClickScroll: true,
      };
      document.addEventListener('DOMContentLoaded', function () {
        const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);
        if (sidebarWrapper && typeof OverlayScrollbarsGlobal?.OverlayScrollbars !== 'undefined') {
          OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
            scrollbars: {
              theme: Default.scrollbarTheme,
              autoHide: Default.scrollbarAutoHide,
              clickScroll: Default.scrollbarClickScroll,
            },
          });
        }
      });
    </script>
    <!--end::OverlayScrollbars Configure-->
    <!--end::Script-->
  </body>
  <!--end::Body-->
</html>
