<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title th:text="${pageTitle} ?: 'Sistema - Ventas'">Sistema - Ventas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" th:href="@{/assets/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/overlayscrollbars.min.css}" />
    <link rel="stylesheet" th:href="@{/assets/bootstrap-icons-1.13.1/bootstrap-icons.min.css}" />
    <link rel="stylesheet" th:href="@{/css/adminlte.css}" />
    <link rel="stylesheet" th:href="@{/css/colors.css}" />
  </head>
  <body class="login-page bg-warning-subtle">
    <div class="login-box">
      <div class="card card-outline card-dark">
        <div class="card-header bg-success">
          <a href="/" class="link-dark text-center link-offset-2 link-opacity-100 link-opacity-50-hover">
            <img th:src="@{/assets/img/logo.jpg}" alt="Happy Paws" class="logo-img" />
            <h1 class="mb-0"><b>Happy paws</b></h1>
          </a>
        </div>
        <div class="card-body login-card-body bg-dark-subtle">
          <p class="login-box-msg">Ingrese sus credenciales de acceso</p>
          <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
          <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="input-group mb-1">
              <div class="form-floating">
                <input id="loginEmail" type="email" name="email" class="form-control" th:value="${email}" placeholder="" required />
                <label for="loginEmail">Email</label>
              </div>
              <div class="input-group-text"><span class="bi bi-envelope"></span></div>
            </div>
            <div class="input-group mb-1">
              <div class="form-floating">
                <input id="loginPassword" type="password" name="password" class="form-control" placeholder="" required/>
                <label for="loginPassword">Password</label>
              </div>
              <div class="input-group-text"><span class="bi bi-lock-fill"></span></div>
            </div>
            <div class="row">
              <div class="col-10">
                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-secondary">Ingresar</button>
                </div>
              </div>
            </div>
          </form>
          <p class="mb-1"><a href="#">¿Olvidaste tu contraseña?</a></p>
          <p class="mb-0"><a th:href="@{/register}" class="text-center"> Regístrate </a></p>
        </div>
      </div>
    </div>
    <script th:src="@{/js/overlayscrollbars.browser.es6.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/adminlte.js}"></script>
    <script>
      const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
      const Default = {
        scrollbarTheme: 'os-theme-light',
        scrollbarAutoHide: 'leave',
        scrollbarClickScroll: true,
      };
      document.addEventListener('DOMContentLoaded', function () {
        const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);
        if (sidebarWrapper && typeof OverlayScrollbarsGlobal?.OverlayScrollbars !== 'undefined') {
          OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
            scrollbars: {
              theme: Default.scrollbarTheme,
              autoHide: Default.scrollbarAutoHide,
              clickScroll: Default.scrollbarClickScroll,
            },
          });
        }
      });
    </script>
  </body>
</html>
