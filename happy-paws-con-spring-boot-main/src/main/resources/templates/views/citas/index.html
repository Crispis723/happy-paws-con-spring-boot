<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas - Happy Paws</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.13.1/bootstrap-icons.min.css}">
</head>
<body>
    <div th:insert="partials/header :: header"></div>
    <!-- Page content -->
    <div class="container-fluid p-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex align-items-center">
                        <h3 class="card-title flex-grow-1"><i class="bi bi-calendar-check"></i> Citas</h3>
                        <a th:href="@{/citas/create}" class="btn btn-primary btn-sm">
                            <i class="bi bi-plus-circle"></i> Nueva Cita
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover table-sm">
                                <thead>
                                    <tr>
                                        <th>Fecha / Hora</th>
                                        <th>Cliente</th>
                                        <th>Teléfono</th>
                                        <th>Mascota</th>
                                        <th>Veterinario</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(citas)}">
                                        <td colspan="8" class="text-center text-muted py-4">No hay citas registradas</td>
                                    </tr>
                                    <tr th:each="cita : ${citas}">
                                        <td th:text="${cita.fechaHora}">--</td>
                                        <td th:text="${cita.clienteNombre}">--</td>
                                        <td th:text="${cita.clienteTelefono}">--</td>
                                        <td th:text="${cita.mascotaNombre}">--</td>
                                        <td th:text="${cita.veterinario}">--</td>
                                        <td><span class="badge bg-primary" th:text="${cita.estado}">Pendiente</span></td>
                                        <td class="text-center">
                                            <a th:href="@{/citas/{id}(id=${cita.id})}" class="btn btn-sm btn-outline-info" title="Ver">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/citas/edit/{id}(id=${cita.id})}" class="btn btn-sm btn-outline-warning" title="Editar">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="if(confirm('¿Está seguro?')) window.location.href=this.dataset.url;" th:data-url="@{/citas/delete/{id}(id=${cita.id})}" title="Eliminar">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:insert="partials/footer :: footer"></div>
</body>
</html>
